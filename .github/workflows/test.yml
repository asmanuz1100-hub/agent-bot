name: Tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
      - name: Build source ZIP
        run: zip -r internal-agent-bot-test.zip . -x ".git/*" "data/*" "*.sqlite3*" ".env"
      - uses: actions/upload-artifact@v4
        with:
          name: internal-agent-bot-test
          path: internal-agent-bot-test.zip
          retention-days: 7
  analytics-postgres:
    # Hisobot so'rovlarini haqiqiy PostgreSQL'da tekshiradi (Render bazasi bilan bir xil dvigatel).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_analytics -v
