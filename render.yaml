# Free test deployment: Telegram webhook + existing Render Postgres.
# Database tables are isolated in DB_SCHEMA=agentbot.
services:
  - type: web
    name: asman-agent-test
    runtime: python
    plan: free
    region: oregon
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt && python -m unittest discover -v
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DB_SCHEMA
        value: agentbot
      - key: MANAGER_MINIAPP_URL
        value: https://asman-manager-miniapp-test.onrender.com/?v=20260924-2
      - key: AGENT_MINIAPP_URL
        value: https://asman-agent-miniapp-v2-test.onrender.com/?v=20260925-shift-v1
      - key: DATABASE_URL
        fromDatabase:
          name: asman-accounting-db-v2
          property: connectionString
      - key: OCR_MODEL
        value: gpt-4.1-mini
