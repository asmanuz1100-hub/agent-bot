<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ASMAN · Ombor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#eef3fb;--card:#fff;--tx:#0b1f4d;--mu:#6b7a99;--line:#e3eaf6;--pri:#1f6bff;--ok:#16b364;--bad:#f0384f;--warn:#f59e0b;--soft:#eaf1ff;--sh:0 4px 14px #0a1f5a0d;
  --safe-top:max(env(safe-area-inset-top,0px),var(--tg-safe-top,0px));--safe-bot:max(env(safe-area-inset-bottom,0px),var(--tg-safe-bottom,0px))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1226;--card:#111c38;--tx:#eaf0ff;--mu:#8a9bc0;--line:#1e2c50;--soft:#172447;--sh:0 4px 14px #0006}}
:root[data-theme="dark"]{--bg:#0a1226;--card:#111c38;--tx:#eaf0ff;--mu:#8a9bc0;--line:#1e2c50;--soft:#172447;--sh:0 4px 14px #0006}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(70% 35% at 100% 25%,#1f6bff18,transparent),radial-gradient(60% 30% at 0% 65%,#8b5cf614,transparent),var(--bg);color:var(--tx);
  font-family:Manrope,Inter,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;display:flex;justify-content:center;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
b,h1,h3{font-weight:800}
.app{width:100%;max-width:440px;min-height:100vh;padding-bottom:calc(110px + var(--safe-bot))}
section{display:none}section.on{display:block;animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* header */
.hd{position:relative;color:#fff;padding:calc(14px + var(--safe-top)) 16px 22px;border-radius:0 0 34px 34px;
  background:radial-gradient(120% 70% at 85% 0%,#2a6bff66,transparent 60%),radial-gradient(90% 60% at 0% 100%,#8b5cf647,transparent 60%),linear-gradient(170deg,#030b24,#061a55 55%,#0a2a8a);
  box-shadow:0 24px 50px -20px #0a2a8acc}
.hd:before{content:"";position:absolute;inset:0;border-radius:inherit;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);
  background-size:26px 26px;-webkit-mask:linear-gradient(#000,transparent 80%);mask:linear-gradient(#000,transparent 80%);pointer-events:none}
.hd>*{position:relative}
.br{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.lg{display:flex;flex-direction:column;gap:3px}.lg img{height:22px;display:block;filter:drop-shadow(0 2px 6px #00000040)}
.lg small{font-size:9px;letter-spacing:3px;opacity:.75;padding-left:1px}
.rt{display:flex;gap:8px}
.rt button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid #ffffff3a;color:#fff;font-size:17px;cursor:pointer;
  background:linear-gradient(145deg,#ffffff26,#ffffff0a);box-shadow:inset 0 1px 0 #ffffff33,0 6px 16px -6px #000a}
.rt button.pf{background:linear-gradient(135deg,#7db4ff,#1f56e0);font-weight:800;font-size:14px;box-shadow:0 0 0 2px #061a55,0 0 0 4px #5aa2ff88}
.rt button.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.gr{margin:0 0 14px 2px}.gr small{display:block;opacity:.7;font-size:12px}.gr b{font-size:21px;letter-spacing:-.4px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:16px;border:1px solid transparent;
  background:linear-gradient(145deg,#ffffff22,#ffffff08) padding-box,linear-gradient(145deg,#9cc4ff99,#ffffff12 45%,#5aa2ff66) border-box;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 24px 50px -18px #00082acc,inset 0 1px 0 #ffffff40}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;background:radial-gradient(#5aa2ff55,transparent 70%);pointer-events:none}
.hero small.k{font-size:11px;letter-spacing:1.2px;opacity:.8;text-transform:uppercase}
.hero h1{margin:4px 0;font-size:30px;letter-spacing:-.6px}.hero h1 u{text-decoration:none;font-size:15px;color:#9cc4ff;font-weight:700}
.hero p{margin:0 0 12px;font-size:13px;opacity:.85}
.live{position:absolute;right:12px;top:12px;font-size:11px;background:#16b36433;border:1px solid #16b364;color:#6ff0b0;padding:4px 10px;border-radius:20px;z-index:1;animation:pl 2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 7px #16b36422}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hb{background:#ffffff12;border:1px solid #ffffff2a;border-radius:16px;padding:11px}.hb small{font-size:11px;opacity:.8;display:block}.hb b{font-size:19px;display:block;margin-top:3px}
/* body */
.bd{padding:14px 14px 0}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:12px;box-shadow:var(--sh)}
.c h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.c h3 a,.lnk{font-size:12px;color:var(--pri);font-weight:700;cursor:pointer;background:none;border:0;padding:0}
.kp{display:flex;gap:10px;align-items:center;cursor:pointer}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--soft)}
.kp small{font-size:12px;color:var(--mu);display:block}.kp b{font-size:20px;display:block}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wa{color:var(--warn)}.mu{color:var(--mu)}
.al{display:flex;gap:10px;align-items:center;border-radius:14px;padding:10px;margin-bottom:8px;cursor:pointer}.al:last-child{margin-bottom:0}
.al b{font-size:13.5px;display:block}.al small{font-size:12px;color:var(--mu)}
.al.r{background:#f0384f14}.al.y{background:#f59e0b18}.al.g{background:#16b3641a}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{background:var(--soft);border:0;border-radius:14px;padding:10px 4px;text-align:center;font-size:11.5px;cursor:pointer;color:var(--tx)}
.qa button span{font-size:22px;display:block}.qa button b{display:block;font-size:12.5px;margin-top:4px}
.ch{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.ch::-webkit-scrollbar{display:none}
.ch button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 13px;font-size:13px;cursor:pointer}
.ch button b{font-size:12px;margin-left:3px;opacity:.75}
.ch button.on{background:linear-gradient(135deg,#6bb4ff,#2a8bf2 45%,#1f6fd1);color:#fff;border-color:transparent}
.seg{display:flex;background:var(--soft);border-radius:16px;padding:4px;margin:2px 0 12px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:10px 6px;border-radius:12px;font-size:13px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--pri);color:#fff}
.row{display:flex;align-items:center;gap:12px;padding:11px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;cursor:pointer;transition:transform .15s}
.row:active{transform:scale(.98)}
.row .t{flex:1;min-width:0}.row .t b{font-size:14.5px;display:block;overflow-wrap:anywhere}.row .t small{font-size:12px;color:var(--mu);display:block;margin-top:2px}
.am{text-align:right;flex:none}.am b{font-size:15px;display:block;margin-bottom:3px}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;background:linear-gradient(135deg,#5aa2ff,#1f4fd8)}
.pill{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:20px;display:inline-block;white-space:nowrap}
.p-ok{background:#16b3641f;color:var(--ok)}.p-bad{background:#f0384f1f;color:var(--bad)}.p-wa{background:#f59e0b24;color:#c77c00}.p-pri{background:#1f6bff1f;color:var(--pri)}.p-mu{background:var(--soft);color:var(--mu)}
.bar{height:5px;border-radius:5px;background:var(--soft);margin-top:7px;overflow:hidden}.bar u{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#5aa2ff,#1f56e0)}
.bar u.lo{background:linear-gradient(90deg,#ffb84d,#f59e0b)}.bar u.z{background:var(--bad)}
.srch{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 14px;margin-bottom:12px;color:var(--mu)}
.srch input{flex:1;border:0;outline:0;background:none;font-size:14px;min-width:0;color:var(--tx)}
.empty{text-align:center;color:var(--mu);padding:22px 10px;font-size:14px}.empty span{display:block;font-size:30px;margin-bottom:6px}
.od{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:12px;box-shadow:var(--sh)}
.od .hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.od .hdr b{font-size:15px}.od .hdr small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.it{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:13.5px}
.it:first-of-type{margin-top:8px}
.it span{min-width:0;overflow-wrap:anywhere}.it em{font-style:normal;font-size:12px;white-space:nowrap}
.note{background:var(--soft);border-radius:12px;padding:8px 10px;font-size:12.5px;margin-top:8px;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:0;background:var(--pri);color:#fff;text-align:center;padding:12px;border-radius:14px;font-weight:700;font-size:14px;cursor:pointer;min-height:44px}
.btn.g{background:var(--soft);color:var(--pri)}.btn.x{flex:0 0 52px}.btn.r{background:#f0384f1a;color:var(--bad)}.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.5;cursor:default}
.tl{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.tl:last-child{border-bottom:0}
.tl small{color:var(--mu)}.tl span{min-width:0;overflow-wrap:anywhere}
.more{display:block;width:100%;margin:4px 0 12px}
/* forms */
label.f{display:block;font-size:12px;color:var(--mu);margin:12px 0 6px;font-weight:600}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:12px;font-size:15px;outline:0;color:var(--tx)}
.inp:focus{border-color:var(--pri)}
textarea.inp{min-height:70px;resize:vertical}
.qty{display:flex;gap:8px;align-items:stretch}
.qty button{width:48px;border:0;border-radius:14px;background:var(--soft);color:var(--pri);font-size:22px;font-weight:800;cursor:pointer}
.qty input{flex:1;text-align:center;font-size:20px;font-weight:800;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.hint{font-size:12.5px;color:var(--mu);margin-top:6px}.hint b{color:var(--tx)}
/* nav, sheet, toast */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-bot));width:min(412px,calc(100% - 24px));display:flex;gap:2px;
  background:#071a4de6;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid #ffffff22;border-radius:26px;padding:8px;z-index:9}
nav button{position:relative;flex:1;border:0;background:none;color:#a9bce6;font-size:11px;padding:7px 2px;border-radius:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:19px}
nav button.on{background:linear-gradient(135deg,#1f6bff,#0d4ad0);color:#fff;box-shadow:0 4px 14px #1f6bff66}
nav button i{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-style:normal;font-size:10.5px;font-weight:800;display:grid;place-items:center}
#ov{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:.3s;z-index:20}#ov.on{opacity:1;pointer-events:auto}
#sh{position:fixed;left:50%;bottom:0;width:min(440px,100%);transform:translate(-50%,105%);transition:.4s cubic-bezier(.2,.9,.3,1);background:var(--card);color:var(--tx);
  border-radius:26px 26px 0 0;padding:10px 18px calc(22px + var(--safe-bot));z-index:21;max-height:90vh;overflow:auto}
#sh.on{transform:translate(-50%,0)}
#sh .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
#sh h2{margin:0 0 4px;font-size:19px}#sh .sub{color:var(--mu);font-size:13px;margin-bottom:6px}
#ts{position:fixed;left:50%;top:calc(12px + var(--safe-top));transform:translate(-50%,-180%);background:#0b1f4d;color:#fff;padding:11px 16px;border-radius:16px;font-size:13.5px;
  z-index:30;transition:.4s;box-shadow:0 8px 24px #0006;max-width:92%;border:1px solid #ffffff22}
#ts.on{transform:translate(-50%,0)}#ts.err{background:#8f1d2c}
/* splash */
#sp{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
  background:radial-gradient(120% 70% at 85% 0%,#2a6bff66,transparent 60%),linear-gradient(170deg,#030b24,#061a55 55%,#0a2a8a);transition:opacity .45s,visibility .45s}
#sp img{width:92px;height:92px;animation:pop .7s cubic-bezier(.3,1.5,.5,1) both}
#sp small{margin-top:12px;font-size:10px;letter-spacing:4px;opacity:.75}
#sp .ldbar{width:120px;height:3px;border-radius:3px;background:#ffffff22;overflow:hidden;margin-top:18px}
#sp .ldbar i{display:block;width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,#6bb4ff,#2a8bf2);animation:ldx 1.1s cubic-bezier(.4,0,.2,1) infinite}
@keyframes ldx{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
#sp.x{opacity:0;visibility:hidden}
#sp.er{background:var(--bg);color:var(--tx);padding:20px}
.ercard{width:min(100%,400px);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:12px;box-shadow:var(--sh)}
.ercard b{font-size:18px}.ercard p{margin:0;color:var(--mu);font-size:14px}
@media (min-width:760px){.app{max-width:760px}.qa{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav id="nav" aria-label="Bo‘limlar"></nav>
<div id="ov"></div>
<div id="sh" role="dialog" aria-modal="true"></div>
<div id="ts" role="status" aria-live="polite"></div>
<div id="sp" role="status" aria-label="Yuklanmoqda"><img src="/app/premium-kit/emblem.png" alt="ASMAN"><small>OMBOR</small><div class="ldbar"><i></i></div></div>
<script>
'use strict';
const tg=window.Telegram&&Telegram.WebApp;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>(Number(n)||0).toLocaleString('ru-RU');
const newRid=()=>'wh'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const MOVE={in:['📥','Kirim','p-ok'],issue:['🚚','Agentga berildi','p-pri'],agent_return:['↩️','Agentdan qabul','p-wa'],writeoff:['🗑','Brak','p-bad']};
const REQ={need:['📥','Tovar so‘rovi'],return:['↩️','Omborga qaytarish']};
const RST={pending:['Kutilmoqda','p-wa'],accepted:['Qabul qilindi','p-ok'],rejected:['Rad etildi','p-bad']};
const OST={new:['Yangi','p-pri'],preparing:['Tayyorlanmoqda','p-wa'],loaded:['Agentga berildi','p-ok'],delivered:['Mijozga yetkazildi','p-mu'],rejected:['Rad etildi','p-bad']};
const OFILTERS=[['open','Ochiq'],['new','Yangi'],['preparing','Tayyorlanmoqda'],['loaded','Berilgan'],['delivered','Yetkazilgan'],['rejected','Rad']];
const MFILTERS=[['','Barchasi'],['in','Kirim'],['issue','Berildi'],['agent_return','Qaytdi'],['writeoff','Brak']];

let S=null,tab=null,busy=false,orderFilter='open',stockMode='wh',stockQ='',moveKind='',movesList=null,movesMore=false;

function units(n,block){n=Number(n)||0;if(block&&Math.abs(n)>=block){const b=Math.trunc(n/block),r=Math.abs(n%block);return `${num(n)} dona · ${num(b)} blok${r?` + ${r}`:''}`;}return `${num(n)} dona`;}
function when(ts){const d=new Date(ts*1000),now=new Date(),t=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime(),diff=Math.round((day(now)-day(d))/864e5);
  return diff===0?`bugun ${t}`:diff===1?`kecha ${t}`:d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})+' '+t;}
function initials(s){return String(s||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';}
function haptic(type){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred(type);}catch(e){}}
function toast(msg,ok=true){const t=$('ts');t.textContent=msg;t.className=ok?'on':'on err';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className=ok?'':'err',3200);haptic(ok?'success':'error');}

async function api(action,payload={}){
  let r;
  try{r=await fetch('/api/warehouse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,orderFilter,...payload,initData:tg?.initData||''})});}
  catch(e){throw Error('Internet aloqasi yo‘q. Qayta urinib ko‘ring.');}
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok)throw Error(j.error||'So‘rov bajarilmadi. Qayta urinib ko‘ring.');
  return j;
}
async function load(quiet){
  const b=$('rf');if(b)b.classList.add('spin');
  try{S=await api('dashboard');movesList=null;render();}
  catch(e){if(!quiet)toast(e.message,false);throw e;}
  finally{const b2=$('rf');if(b2)b2.classList.remove('spin');}
}
async function act(action,payload,okMsg,after){
  if(busy)return false;busy=true;
  const locked=[...document.querySelectorAll('#sh .btn:not(:disabled),.od .btn:not(:disabled)')];
  locked.forEach(b=>b.disabled=true);
  try{S=await api(action,payload);movesList=null;toast(okMsg);after&&after();render();return true;}
  catch(e){toast(e.message,false);return false;}
  finally{busy=false;locked.forEach(b=>b.disabled=false);}
}
const keeper=()=>S&&S.mode==='keeper';
const product=p=>(S.products||[]).find(x=>x.pack==p);
const activeProducts=()=>(S.products||[]).filter(p=>p.active!==false);
const agentName=id=>((S.agents||[]).find(a=>a.id==id)||{}).name||('#'+id);

/* ---------- layout ---------- */
function tabs(){
  if(keeper()){const o=S.orders||{},open=(o.counts?.new||0)+(o.counts?.preparing||0);
    return [['home','🏠','Asosiy'],['orders','🛒','Buyurtma',open],['requests','📨','So‘rov',(S.requests||[]).length],['stock','📦','Qoldiq'],['moves','🧾','Tarix']];}
  return [['home','🏠','Asosiy'],['mine','📋','So‘rovlarim',(S.requests||[]).filter(r=>r.status==='pending').length]];
}
function go(t){tab=t;closeSheet();render();scrollTo(0,0);}
function render(){
  if(!S)return;
  const ts=tabs();if(!tab||!ts.some(x=>x[0]===tab))tab=ts[0][0];
  $('nav').innerHTML=ts.map(([k,ic,l,c])=>`<button class="${k===tab?'on':''}" data-t="${k}" aria-label="${esc(l)}"><span>${ic}</span>${esc(l)}${c?`<i>${c>99?'99+':c}</i>`:''}</button>`).join('');
  $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.t));
  const views=keeper()?{home:kHome,orders:kOrders,requests:kRequests,stock:kStock,moves:kMoves}:{home:aHome,mine:aMine};
  $('app').innerHTML=`<section class="on">${header()}<div class="bd" id="bd"></div></section>`;
  views[tab]($('bd'));
  $('rf').onclick=()=>load().catch(()=>{});
  $('th').onclick=toggleTheme;
  $('pf').onclick=()=>openSheet(`<h2>${esc(S.me.name||'Foydalanuvchi')}</h2><div class="sub">${roleName()} · ID ${esc(S.me.id)}</div>
    <div class="tl"><span>Ilova</span><b>ASMAN Ombor</b></div><div class="tl"><span>Ma’lumot yangilandi</span><b>${new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</b></div>
    <div class="acts"><button class="btn g" id="cl">Yopish</button></div>`,s=>s.querySelector('#cl').onclick=closeSheet);
}
function roleName(){return keeper()?(S.me.role==='admin'?'Rahbar':'Omborchi'):'Agent';}

/* ---------- operation sheet (keeper + agent request) ---------- */
const OPS={receive:['📥','Kirim','Ishlab chiqarish yoki xariddan omborga','Kirim'],issue:['🚚','Agentga berish','Ombordan agentga tovar','Berish'],
  take_back:['↩️','Agentdan qabul','Agent tovarni omborga qaytardi','Qabul'],writeoff:['🗑','Brak / hisobdan chiqarish','Shikastlangan yoki yaroqsiz tovar','Brak'],
  need:['📥','Tovar so‘rash','Ombordan tovar so‘rash','So‘rash'],return:['↩️','Omborga qaytarish','Qo‘ldagi tovarni omborga qaytarish','Qaytarish']};
function opSheet(kind,pre={}){
  const agentMode=!keeper();
  const ops=agentMode?['need','return']:['receive','issue','take_back','writeoff'];
  const st={kind,unit:'Дона',rid:newRid(),pack:pre.pack?+pre.pack:null,agent:pre.agent?+pre.agent:null};
  const draw=()=>{
    const list=agentMode?(st.kind==='return'?(S.products||[]).filter(p=>p.free>0):(S.products||[]))
      :(st.kind==='take_back'&&st.agent?activeProducts().filter(p=>(agentOf(st.agent).stock[p.pack]||0)>0):activeProducts());
    if(!list.some(p=>p.pack===st.pack))st.pack=list.length?list[0].pack:null;
    const p=st.pack!=null?product(st.pack):null;
    if(!(p&&p.block))st.unit='Дона';
    const needAgent=st.kind==='issue'||st.kind==='take_back';
    if(needAgent&&!st.agent&&(S.agents||[]).length)st.agent=S.agents[0].id;
    const [ic,title,sub]=OPS[st.kind];
    let have='';
    if(p){if(agentMode)have=st.kind==='return'?`Qaytarish mumkin: <b>${units(p.free,p.block)}</b>`:`Qo‘lingizda: <b>${units(p.stock,p.block)}</b>`;
      else if(st.kind==='take_back')have=`Agentda: <b>${units(agentOf(st.agent).stock[p.pack]||0,p.block)}</b> · omborda ${units(p.stock,p.block)}`;
      else have=`Omborda: <b>${units(p.stock,p.block)}</b>${p.demand?` · buyurtmalarga ${num(p.demand)} kerak`:''}`;}
    const s=$('sh');
    s.innerHTML=`<div class="grab"></div><h2>${ic} ${title}</h2><div class="sub">${sub}</div>
      <div class="seg" id="fk">${ops.map(k=>`<button data-k="${k}" class="${k===st.kind?'on':''}">${OPS[k][0]} ${OPS[k][3]}</button>`).join('')}</div>
      ${needAgent?`<label class="f" for="fa">Agent</label><select class="inp" id="fa">${(S.agents||[]).map(a=>`<option value="${a.id}" ${a.id===st.agent?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`:''}
      <label class="f" for="fp">Mahsulot</label>${list.length?`<select class="inp" id="fp">${list.map(x=>`<option value="${x.pack}" ${x.pack===st.pack?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`
        :`<div class="note">${agentMode&&st.kind==='return'?'Qaytarish uchun erkin tovar yo‘q.':st.kind==='take_back'?'Bu agentning qo‘lida tovar yo‘q.':'Mahsulot yo‘q.'}</div>`}
      <div class="hint">${have}</div>
      <label class="f" for="fq">Miqdor</label><div class="qty"><button id="qm" aria-label="Kamaytirish">−</button><input class="inp" id="fq" type="number" min="1" inputmode="numeric" placeholder="0" value="${st.qty||''}"><button id="qp" aria-label="Ko‘paytirish">+</button></div>
      ${p&&p.block?`<div class="seg" id="fu" style="margin-top:8px"><button data-u="Дона" class="${st.unit==='Дона'?'on':''}">Dona</button><button data-u="Блок" class="${st.unit==='Блок'?'on':''}">Blok (${p.block} dona)</button></div>`:''}
      <div class="hint" id="tot"></div>
      <label class="f" for="fn">${st.kind==='writeoff'?'Brak sababi (majburiy)':'Izoh (ixtiyoriy)'}</label><textarea class="inp" id="fn" maxlength="300">${esc(st.note||'')}</textarea>
      <div class="acts"><button class="btn g" id="cn">Bekor</button><button class="btn" id="go" ${list.length&&(!needAgent||st.agent)?'':'disabled'}>${agentMode?'Yuborish':'Saqlash'}</button></div>`;
    const q=s.querySelector('#fq'),tot=()=>{const n=+q.value||0;s.querySelector('#tot').innerHTML=st.unit==='Блок'&&p&&n?`Jami: <b>${num(n*p.block)} dona</b>`:'';};
    const keep=()=>{st.qty=q.value;st.note=s.querySelector('#fn').value;};
    s.querySelectorAll('#fk button').forEach(b=>b.onclick=()=>{keep();st.kind=b.dataset.k;st.rid=newRid();draw();});
    s.querySelectorAll('#fu button').forEach(b=>b.onclick=()=>{keep();st.unit=b.dataset.u;draw();});
    const fa=s.querySelector('#fa');if(fa)fa.onchange=()=>{keep();st.agent=+fa.value;draw();};
    const fp=s.querySelector('#fp');if(fp)fp.onchange=()=>{keep();st.pack=+fp.value;draw();};
    s.querySelector('#qm').onclick=()=>{q.value=Math.max(1,(+q.value||1)-1);tot();};
    s.querySelector('#qp').onclick=()=>{q.value=(+q.value||0)+1;tot();};
    q.oninput=tot;tot();
    s.querySelector('#cn').onclick=closeSheet;
    s.querySelector('#go').onclick=()=>{keep();
      const qty=Number(st.qty);if(!Number.isInteger(qty)||qty<1){toast('Miqdorni kiriting (butun son).',false);return;}
      const note=(st.note||'').trim();if(st.kind==='writeoff'&&!note){toast('Brak sababini yozing.',false);return;}
      const payload={pack:st.pack,qty,unit:st.unit,note,requestId:st.rid};
      if(agentMode){act('request',{...payload,kind:st.kind},'✅ So‘rov omborchiga yuborildi',closeSheet);return;}
      if(needAgent)payload.agent=st.agent;
      act(st.kind,payload,{receive:'📥 Kirim saqlandi',issue:'🚚 Agentga berildi',take_back:'↩️ Omborga qabul qilindi',writeoff:'🗑 Hisobdan chiqarildi'}[st.kind],closeSheet);};
  };
  showSheet();draw();
}
function agentOf(id){return (S.agents||[]).find(a=>a.id===id)||{stock:{}};}

/* ---------- agent mode ---------- */
function aHome(v){
  const ps=(S.products||[]).filter(p=>p.stock!==0);
  v.innerHTML=`<div class="c"><h3>Omborga murojaat</h3><div class="two">
      <button class="btn" data-op="need">📥 Tovar so‘rash</button><button class="btn g" data-op="return">↩️ Qaytarish</button></div></div>
    <div class="c"><h3>Qo‘limdagi tovar</h3>${ps.map(p=>`<div class="tl"><span>${esc(p.name)}${p.free!==p.stock?`<br><small>qaytarishga band: ${num(p.stock-p.free)}</small>`:''}</span><b class="${p.stock<0?'bad':''}">${units(p.stock,p.block)}</b></div>`).join('')
      ||'<div class="empty"><span>📭</span>Qo‘lingizda tovar yo‘q</div>'}</div>
    <div class="c"><h3>So‘nggi so‘rovlar <a data-go="mine">Barchasi</a></h3>${(S.requests||[]).slice(0,3).map(reqLine).join('')||'<div class="empty">So‘rov yo‘q</div>'}</div>`;
  bindCommon(v);
}
function reqLine(r){const k=REQ[r.kind]||['•',r.kind],st=RST[r.status]||[r.status,'p-mu'],p=product(r.pack)||{block:0};
  return `<div class="tl"><span>${k[0]} <b>${esc(r.name)}</b><br><small>${k[1]} #${r.id} · ${when(r.ts)}${r.note?' · '+esc(r.note):''}</small></span>
    <span style="text-align:right"><b>${units(r.qty,p.block)}</b><br><span class="pill ${st[1]}">${st[0]}</span></span></div>`;}
function aMine(v){
  const rs=S.requests||[];
  v.innerHTML=`<div class="c">${rs.map(reqLine).join('')||'<div class="empty"><span>📋</span>So‘rovlar yo‘q</div>'}</div>
    <div class="two"><button class="btn" data-op="need">📥 Tovar so‘rash</button><button class="btn g" data-op="return">↩️ Qaytarish</button></div>`;
  bindCommon(v);
}

/* ---------- sheet & theme ---------- */
function showSheet(){$('sh').classList.add('on');$('ov').classList.add('on');try{tg&&tg.BackButton.show();}catch(e){}}
function openSheet(html,bind){const s=$('sh');s.innerHTML='<div class="grab"></div>'+html;showSheet();bind&&bind(s);}
function closeSheet(){$('sh').classList.remove('on');$('ov').classList.remove('on');try{tg&&tg.BackButton.hide();}catch(e){}}
$('ov').onclick=closeSheet;
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
function applyTheme(t){if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;}
function toggleTheme(){const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  const t=dark?'light':'dark';applyTheme(t);try{localStorage.setItem('omborTheme',t);}catch(e){}}
try{applyTheme(localStorage.getItem('omborTheme')||(tg&&tg.colorScheme)||'');}catch(e){applyTheme(tg&&tg.colorScheme||'');}

/* ---------- start ---------- */
function splashDone(){const sp=$('sp');if(!sp)return;sp.classList.add('x');setTimeout(()=>sp.remove(),500);}
function splashFail(msg,retry){const sp=$('sp');if(!sp)return;sp.className='er';
  sp.innerHTML=`<div class="ercard"><b>Ombor panelini ochib bo‘lmadi</b><p></p>${retry?'<button class="btn" id="rt">Qayta urinish</button>':''}</div>`;
  sp.querySelector('p').textContent=msg;if(retry)$('rt').onclick=()=>{sp.className='';sp.innerHTML='<img src="/app/premium-kit/emblem.png" alt="ASMAN"><small>OMBOR</small><div class="ldbar"><i></i></div>';start();};}
function start(){load(true).then(splashDone).catch(e=>splashFail(e.message,true));}
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#030b24');}catch(e){}
  try{tg.BackButton.onClick(closeSheet);}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&!busy&&!$('sh').classList.contains('on'))load(true).catch(()=>{});});
if(!tg||!tg.initData)splashFail('Panelni Telegram botdagi «📱 Омбор Mini App» yoki «📦 Омбор сўрови» tugmasidan oching.',false);
else start();
</script>
</body>
</html>
