<style>
/* Rahbar Premium bilan bir xil dizayn tizimi (ranglar, kartalar, ikonkalar, navigatsiya). */
:root{--bg:#f1f2f6;--card:#fff;--tx:#17212b;--mu:#7b8794;--line:#e7e9ef;--pri:#2a8bf2;--ok:#16b364;--bad:#f0384f;--warn:#f59e0b;--soft:#f3f5f9;--k:#1f6fd1;
  --sh:0 1px 0 #fff inset,0 14px 30px -18px #0a2a8a40;--grad:linear-gradient(135deg,#6bb4ff,#2a8bf2 45%,#1f6fd1);--wm:brightness(0);
  --safe-top:max(env(safe-area-inset-top,0px),var(--tg-safe-top,0px));--safe-bot:max(env(safe-area-inset-bottom,0px),var(--tg-safe-bottom,0px))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1621;--card:#17212b;--tx:#f5f7fa;--mu:#8b98a5;--line:#242f3d;--soft:#1e2a38;--k:#7db6f5;--sh:0 10px 24px -16px #000a;--wm:none}}
:root[data-theme="dark"]{--bg:#0e1621;--card:#17212b;--tx:#f5f7fa;--mu:#8b98a5;--line:#242f3d;--soft:#1e2a38;--k:#7db6f5;--sh:0 10px 24px -16px #000a;--wm:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Manrope,Inter,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.08px;display:flex;justify-content:center;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{touch-action:manipulation}
b,h1,h2,h3{font-weight:800}
.app{width:100%;max-width:440px;min-height:100vh;padding-bottom:calc(112px + var(--safe-bot))}
section{display:none}section.on{display:block;animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
ico{display:inline-grid;place-items:center;vertical-align:-.16em;line-height:0}ico svg{width:1.1em;height:1.1em}
/* header */
.hd{padding:calc(16px + var(--safe-top)) 16px 6px}
.br{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.lg{display:flex;flex-direction:column;align-items:flex-start;gap:2px}.lg img{height:22px;display:block;filter:var(--wm)}
.lg small,.k{color:var(--k);font-size:9px;font-weight:700;letter-spacing:2.4px;padding-left:1px}
.rt{display:flex;gap:10px}
.rt button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--tx);cursor:pointer;font-size:18px}
.rt button ico svg{width:19px;height:19px}
.rt button.pf{background:var(--grad);color:#fff;font-weight:700;font-size:15px}
.rt button.spin ico{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.gr{margin:0 0 14px 2px}.gr small{display:block;font-size:12px;letter-spacing:.3px}.gr b{font-size:21px;letter-spacing:-.4px}.gr b ico{color:var(--tx);margin-left:4px}
.hero{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--sh);margin-bottom:6px}
.hero>:not(.mt):not(.live){position:relative;z-index:1}
.mt{position:absolute;right:0;bottom:0;width:78%;height:100%;pointer-events:none;opacity:.1}
.hero .k{font-size:11px;display:block}
.hero h1{margin:4px 0;font-size:25px;letter-spacing:-.6px}.hero h1 u{text-decoration:none;font-size:14px;color:var(--pri);font-weight:800;letter-spacing:0}
.hero p{margin:0 0 12px;font-size:13px}
.live{position:absolute;right:12px;top:12px;z-index:2;font-size:11px;background:#34c7591f;border:1px solid #34c75966;color:#1c9b43;padding:4px 10px;border-radius:20px;animation:pl 2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 7px #16b36412}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hb{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:11px}.hb small{font-size:11px;color:var(--mu);display:block}.hb b{font-size:19px;display:block;margin-top:3px}
/* body */
.bd{padding:12px 14px 0}
.c{background:linear-gradient(var(--card),color-mix(in srgb,var(--card) 99%,var(--pri)));border:1px solid var(--line);border-radius:22px;padding:13px;margin-bottom:12px;box-shadow:var(--sh)}
.c h3{margin:0 0 10px;font-size:14.5px;letter-spacing:.1px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.c h3 a,.lnk{font-size:12px;color:var(--pri);font-weight:700;cursor:pointer;background:none;border:0;padding:0}
.kp{display:flex;gap:10px;align-items:center;cursor:pointer}
.ic{--a:#2a8bf2;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;
  background:linear-gradient(160deg,#ffffff4d,#fff0 60%),var(--a);box-shadow:0 6px 12px -7px var(--a)}
.ic ico svg{width:22px;height:22px;stroke-width:1.9}
.ic.s{width:36px;height:36px;border-radius:12px}.ic.s ico svg{width:18px;height:18px}
.kp small{font-size:12px;color:var(--mu);display:block}.kp b{font-size:21px;letter-spacing:-.4px;display:block}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wa{color:#c77c00}.mu{color:var(--mu)}
.al{--t:#f0384f;display:flex;gap:10px;align-items:center;border-radius:14px;padding:10px;margin-bottom:8px;cursor:pointer;
  background:linear-gradient(90deg,color-mix(in srgb,var(--t) 14%,transparent),color-mix(in srgb,var(--t) 3%,transparent));border:1px solid color-mix(in srgb,var(--t) 18%,transparent)}
.al:last-child{margin-bottom:0}.al.y{--t:#f59e0b}.al.g{--t:#16b364}
.al b{font-size:13.5px;display:block}.al small{font-size:12px;color:var(--mu)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);border-radius:18px;padding:12px 4px;text-align:center;font-size:12px;cursor:pointer;color:var(--mu)}
.qa button:active{transform:scale(.94)}
.qa button span{width:44px;height:44px;margin:0 auto 4px;border-radius:14px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(160deg,#ffffff4d,#fff0 60%),var(--q,#2a8bf2);box-shadow:0 8px 14px -8px var(--q,#2a8bf2)}
.qa button span ico svg{width:22px;height:22px;stroke-width:1.9}
.qa button b{display:block;font-size:13px;color:var(--tx);margin-top:4px}
.ch{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}.ch::-webkit-scrollbar{display:none}
.ch button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer}
.ch button b{font-size:12px;margin-left:3px;opacity:.75}
.ch button.on{background:var(--grad);color:#fff;box-shadow:0 8px 18px -8px #1f6fd1cc}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:4px;margin:2px 0 12px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:10px 6px;border-radius:12px;font-size:13.5px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 8px 18px -8px #1f6fd1cc}
.row{display:flex;align-items:center;gap:12px;padding:11px;background:linear-gradient(var(--card),color-mix(in srgb,var(--card) 99%,var(--pri)));
  border:1px solid var(--line);border-radius:22px;margin-bottom:10px;cursor:pointer;box-shadow:var(--sh);transition:transform .15s}
.row:active{transform:scale(.98)}
.row .t{flex:1;min-width:0}.row .t b{font-size:14.5px;display:block;overflow-wrap:anywhere}.row .t small{font-size:12px;color:var(--mu);display:block;margin-top:2px}
.am{text-align:right;flex:none}.am b{font-size:15px;display:block;margin-bottom:3px}.am small{font-size:12px;color:var(--mu)}
.av{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;background:linear-gradient(135deg,#5aa2ff,#1f4fd8);box-shadow:0 10px 18px -10px #17212baa}
.pill{font-size:11.5px;font-weight:600;letter-spacing:.2px;padding:4px 9px;border-radius:20px;display:inline-block;white-space:nowrap;--p:#2a8bf2;
  color:var(--p);background:color-mix(in srgb,var(--p) 12%,transparent);border:1px solid color-mix(in srgb,var(--p) 22%,transparent)}
.p-ok{--p:#16b364}.p-bad{--p:#f0384f}.p-wa{--p:#d48806}.p-pri{--p:#2a8bf2}.p-mu{--p:#7b8794}
.bar{height:5px;border-radius:5px;background:var(--soft);margin-top:8px;overflow:hidden}.bar u{display:block;height:100%;border-radius:5px;background:var(--grad)}
.bar u.lo{background:linear-gradient(90deg,#ffb84d,#f59e0b)}
.srch{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px;margin-bottom:12px;color:var(--mu);box-shadow:var(--sh)}
.srch ico svg{width:19px;height:19px}
.srch input{flex:1;border:0;outline:0;background:none;font-size:14px;min-width:0;color:var(--tx)}
.empty{text-align:center;color:var(--mu);padding:20px 10px;font-size:14px}.empty .ic{margin:0 auto 10px;--a:#8b98a5}
.od{background:linear-gradient(var(--card),color-mix(in srgb,var(--card) 99%,var(--pri)));border:1px solid var(--line);border-radius:22px;padding:13px;margin-bottom:12px;box-shadow:var(--sh)}
.od .hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.od .hdr b{font-size:15px}.od .hdr small{display:block;color:var(--mu);font-size:12px;margin-top:3px}
.od .hdr small ico{margin-right:3px}
.it{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:13.5px}
.it:first-of-type{margin-top:8px}
.it span{min-width:0;overflow-wrap:anywhere}.it em{font-style:normal;font-size:12px;white-space:nowrap;font-weight:600}
.note{background:var(--soft);border-radius:12px;padding:8px 10px;font-size:12.5px;margin-top:8px;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:0;background:var(--grad);color:#fff;text-align:center;padding:13px;border-radius:14px;font-weight:800;font-size:14px;cursor:pointer;min-height:46px;box-shadow:0 8px 18px -10px #1f6fd1cc}
.btn ico{margin-right:6px}
.btn.g{background:var(--soft);color:var(--pri);box-shadow:none}.btn.r{background:#f0384f1a;color:var(--bad);box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#34c759,#16b364);box-shadow:0 8px 18px -10px #16b364cc}.btn.x{flex:0 0 52px}.btn.x ico{margin:0}
.btn:disabled{opacity:.5;cursor:default}
.tl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.tl:last-child{border-bottom:0}
.tl small{color:var(--mu)}.tl .tx{flex:1;min-width:0;overflow-wrap:anywhere}.tl>b{white-space:nowrap}
.more{display:block;width:100%;margin:4px 0 12px}
.ro{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--pri) 10%,transparent);border:1px solid color-mix(in srgb,var(--pri) 20%,transparent);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:12.5px}
/* forms */
label.f{display:block;font-size:12px;color:var(--mu);margin:12px 0 6px;font-weight:600}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:12px;font-size:15px;outline:0;color:var(--tx)}
.inp:focus{border-color:var(--pri)}
textarea.inp{min-height:70px;resize:vertical}
.qty{display:flex;gap:8px;align-items:stretch}
.qty button{width:48px;border:0;border-radius:14px;background:var(--soft);color:var(--pri);font-size:22px;font-weight:800;cursor:pointer}
.qty input{flex:1;text-align:center;font-size:20px;font-weight:800;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.hint{font-size:12.5px;color:var(--mu);margin-top:6px}.hint b{color:var(--tx)}
/* nav, sheet, toast */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-bot));width:min(412px,calc(100% - 24px));display:flex;padding:8px;z-index:9;border-radius:30px;
  background:color-mix(in srgb,var(--card) 90%,transparent);border:1px solid var(--line);box-shadow:0 14px 32px -14px #17212b55;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#ni{position:absolute;top:8px;bottom:8px;left:0;width:60px;border-radius:22px;background:var(--grad);box-shadow:0 10px 24px -8px #1f6fd1cc,inset 0 1px 0 #ffffff88;transition:transform .5s cubic-bezier(.3,1.35,.5,1),width .3s}
nav button{position:relative;z-index:1;flex:1;border:0;background:none;color:var(--mu);font-size:11px;font-weight:700;padding:7px 2px;border-radius:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button span{line-height:0}nav button span ico svg{width:22px;height:22px}
nav button.on{color:#fff;font-weight:800}
nav button i{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-style:normal;font-size:10.5px;font-weight:800;display:grid;place-items:center}
#ov{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:.3s;z-index:20}#ov.on{opacity:1;pointer-events:auto}
#sh{position:fixed;left:50%;bottom:0;width:min(440px,100%);transform:translate(-50%,105%);transition:.4s cubic-bezier(.2,.9,.3,1);background:var(--card);color:var(--tx);
  border-radius:26px 26px 0 0;padding:10px 18px calc(22px + var(--safe-bot));z-index:21;max-height:90vh;overflow:auto}
#sh.on{transform:translate(-50%,0)}
#sh .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
#sh h2{margin:0 0 4px;font-size:19px;display:flex;align-items:center;gap:10px}#sh .sub{color:var(--mu);font-size:13px;margin-bottom:6px}
#ts{position:fixed;left:50%;top:calc(12px + var(--safe-top));transform:translate(-50%,-180%);background:#17212b;color:#fff;padding:11px 16px;border-radius:16px;font-size:13.5px;
  z-index:30;transition:.4s;box-shadow:0 8px 24px #0006;max-width:92%;border:1px solid #2a8bf255}
#ts.on{transform:translate(-50%,0)}#ts.err{background:#8f1d2c;border-color:#f0384f66}
/* splash */
#sp{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
  background:radial-gradient(120% 70% at 85% 0%,#2a6bff66,transparent 60%),linear-gradient(170deg,#030b24,#061a55 55%,#0a2a8a);transition:opacity .45s,visibility .45s}
#sp img{width:92px;height:92px;animation:pop .7s cubic-bezier(.3,1.5,.5,1) both}
#sp small{margin-top:12px;font-size:10px;letter-spacing:4px;opacity:.75}
#sp .ldbar{width:120px;height:3px;border-radius:3px;background:#ffffff22;overflow:hidden;margin-top:18px}
#sp .ldbar i{display:block;width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,#6bb4ff,#2a8bf2);animation:ldx 1.1s cubic-bezier(.4,0,.2,1) infinite}
@keyframes ldx{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
#sp.x{opacity:0;visibility:hidden}
#sp.er{background:var(--bg);color:var(--tx);padding:20px}
.ercard{width:min(100%,400px);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:12px;box-shadow:var(--sh)}
.ercard b{font-size:18px}.ercard p{margin:0;color:var(--mu);font-size:14px}
@media (min-width:760px){.app{max-width:760px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.pimg{width:44px;height:44px;border-radius:14px;object-fit:contain;padding:2px;box-sizing:border-box;flex:none;background:#fff;border:1px solid var(--line)}
.pbig{display:block;width:100%;max-height:260px;object-fit:contain;border-radius:16px;background:#fff;margin:10px 0 6px;cursor:zoom-in}
.pfull{position:fixed;inset:0;z-index:9999;background:#000d;display:flex;align-items:center;justify-content:center;padding:16px}.pfull img{max-width:100%;max-height:100%;border-radius:14px}
.pact{display:flex;gap:8px;margin:6px 0 10px}.pact label,.pact button{flex:1;text-align:center}.pact input{display:none}
</style>

function units(n,block){n=Number(n)||0;if(block&&Math.abs(n)>=block){const b=Math.trunc(n/block),r=Math.abs(n%block);return `${num(n)} dona · ${num(b)} blok${r?` + ${r}`:''}`;}return `${num(n)} dona`;}
function when(ts){const d=new Date(ts*1000),now=new Date(),t=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime(),diff=Math.round((day(now)-day(d))/864e5);

async function api(action,payload={}){

  try{r=await fetch('/api/warehouse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,orderFilter,...payload,initData:tg?.initData||''})});}
  catch(e){throw Error('Internet aloqasi yo‘q. Qayta urinib ko‘ring.');}
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok)throw Error(j.error||'So‘rov bajarilmadi. Qayta urinib ko‘ring.');
  return j;
}
async function load(quiet){

async function act(action,payload,okMsg,after){
  if(busy)return false;busy=true;
  const locked=[...document.querySelectorAll('#sh .btn:not(:disabled),.od .btn:not(:disabled)')];
  locked.forEach(b=>b.disabled=true);
  try{S=await api(action,payload);movesList=null;toast(okMsg);after&&after();render();return true;}
  catch(e){toast(e.message,false);return false;}
  finally{busy=false;locked.forEach(b=>b.disabled=false);}
}

function shrinkImage(file){return new Promise((ok,no)=>{if(!file||!/^image\//.test(file.type||'image/'))return no(Error('Rasm faylini tanlang.'));const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.max(1,Math.round(im.naturalWidth*k)),h=Math.max(1,Math.round(im.naturalHeight*k)),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(url);
    let q=.86,d=c.toDataURL('image/jpeg',q);while(d.length*.75>1100000&&q>.4){q-=.12;d=c.toDataURL('image/jpeg',q);}ok(d);};
  im.onerror=()=>{URL.revokeObjectURL(url);no(Error('Rasm ochilmadi.'));};im.src=url;});}

/* ---------- operation sheet (keeper + agent request) ---------- */
const OPS={receive:['down',C.green,'Kirim','Ishlab chiqarish yoki xariddan omborga','Kirim'],issue:['truck',C.blue,'Agentga berish','Ombordan agentga tovar','Berish'],
  take_back:['undo',C.orange,'Agentdan qabul','Agent tovarni omborga qaytardi','Qabul'],writeoff:['trash',C.red,'Brak / hisobdan chiqarish','Shikastlangan yoki yaroqsiz tovar','Brak'],
  need:['down',C.blue,'Tovar so‘rash','Ombordan tovar so‘rash','So‘rash'],return:['undo',C.orange,'Omborga qaytarish','Sotilmagan yoki brak tovarni omborga qaytarish','Qaytarish']};
function agentOf(id){return (S.agents||[]).find(a=>a.id===id)||{stock:{}};}
function opSheet(kind,pre={}){
  const agentMode=!keeper();
  if(!agentMode&&!canOp())return;
  const ops=agentMode?['need','return']:['receive','issue','take_back','writeoff'];
  const st={kind,unit:'Дона',rid:newRid(),pack:pre.pack?+pre.pack:null,agent:pre.agent?+pre.agent:null};
  const draw=()=>{
    const list=agentMode?(st.kind==='return'?(S.products||[]).filter(p=>p.free>0):(S.products||[]))
      :(st.kind==='take_back'&&st.agent?activeProducts().filter(p=>(agentOf(st.agent).stock[p.pack]||0)>0):activeProducts());
    if(!list.some(p=>p.pack===st.pack))st.pack=list.length?list[0].pack:null;
    const p=st.pack!=null?product(st.pack):null;
    if(!(p&&p.block))st.unit='Дона';
    const needAgent=st.kind==='issue'||st.kind==='take_back';
    if(needAgent&&!st.agent&&(S.agents||[]).length)st.agent=S.agents[0].id;
    const [icon,color,title,sub]=OPS[st.kind];
    let have='';
    if(p){if(agentMode)have=st.kind==='return'?`Qaytarish mumkin: <b>${units(p.free,p.block)}</b>`:`Qo‘lingizda: <b>${units(p.stock,p.block)}</b>`;
      else if(st.kind==='take_back')have=`Agentda: <b>${units(agentOf(st.agent).stock[p.pack]||0,p.block)}</b> · omborda ${units(p.stock,p.block)}`;
      else have=`Omborda: <b>${units(p.stock,p.block)}</b>${p.demand?` · buyurtmalarga ${num(p.demand)} kerak`:''}`;}
    const s=$('sh');
    s.innerHTML=`<div class="grab"></div><h2>${box(icon,color)}${title}</h2><div class="sub">${sub}</div>
      <div class="seg" id="fk">${ops.map(k=>`<button data-k="${k}" class="${k===st.kind?'on':''}">${OPS[k][4]}</button>`).join('')}</div>
      ${needAgent?`<label class="f" for="fa">Agent</label><select class="inp" id="fa">${(S.agents||[]).map(a=>`<option value="${a.id}" ${a.id===st.agent?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`:''}
      <label class="f" for="fp">Mahsulot</label>${list.length?`<select class="inp" id="fp">${list.map(x=>`<option value="${x.pack}" ${x.pack===st.pack?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`
        :`<div class="note">${agentMode&&st.kind==='return'?'Qaytarish uchun erkin tovar yo‘q.':st.kind==='take_back'?'Bu agentning qo‘lida tovar yo‘q.':'Mahsulot yo‘q.'}</div>`}
      <div class="hint">${have}</div>
      <label class="f" for="fq">Miqdor</label><div class="qty"><button id="qm" aria-label="Kamaytirish">−</button><input class="inp" id="fq" type="number" min="1" inputmode="numeric" placeholder="0" value="${esc(st.qty||'')}"><button id="qp" aria-label="Ko‘paytirish">+</button></div>
      ${p&&p.block?`<div class="seg" id="fu" style="margin-top:8px"><button data-u="Дона" class="${st.unit==='Дона'?'on':''}">Dona</button><button data-u="Блок" class="${st.unit==='Блок'?'on':''}">Blok (${p.block} dona)</button></div>`:''}
      <div class="hint" id="tot"></div>
      <label class="f" for="fn">${st.kind==='writeoff'?'Brak sababi (majburiy)':'Izoh (ixtiyoriy)'}</label><textarea class="inp" id="fn" maxlength="300">${esc(st.note||'')}</textarea>
      <div class="acts"><button class="btn g" id="cn">Bekor</button><button class="btn" id="go" ${list.length&&(!needAgent||st.agent)?'':'disabled'}>${agentMode?I('send')+'Yuborish':I('check')+'Saqlash'}</button></div>`;
    const q=s.querySelector('#fq'),tot=()=>{const n=+q.value||0;s.querySelector('#tot').innerHTML=st.unit==='Блок'&&p&&n?`Jami: <b>${num(n*p.block)} dona</b>`:'';};
    const keep=()=>{st.qty=q.value;st.note=s.querySelector('#fn').value;};
    s.querySelectorAll('#fk button').forEach(b=>b.onclick=()=>{keep();st.kind=b.dataset.k;st.rid=newRid();draw();});
    s.querySelectorAll('#fu button').forEach(b=>b.onclick=()=>{keep();st.unit=b.dataset.u;draw();});
    const fa=s.querySelector('#fa');if(fa)fa.onchange=()=>{keep();st.agent=+fa.value;draw();};
    const fp=s.querySelector('#fp');if(fp)fp.onchange=()=>{keep();st.pack=+fp.value;draw();};
    s.querySelector('#qm').onclick=()=>{q.value=Math.max(1,(+q.value||1)-1);tot();};
    s.querySelector('#qp').onclick=()=>{q.value=(+q.value||0)+1;tot();};
    q.oninput=tot;tot();
    s.querySelector('#cn').onclick=closeSheet;
    s.querySelector('#go').onclick=()=>{keep();
      const qty=Number(st.qty);if(!Number.isInteger(qty)||qty<1){toast('Miqdorni kiriting (butun son).',false);return;}
      const note=(st.note||'').trim();if(st.kind==='writeoff'&&!note){toast('Brak sababini yozing.',false);return;}
      const payload={pack:st.pack,qty,unit:st.unit,note,requestId:st.rid};
      if(agentMode){act('request',{...payload,kind:st.kind},'So‘rov omborchiga yuborildi',closeSheet);return;}
      if(needAgent)payload.agent=st.agent;
      act(st.kind,payload,{receive:'Kirim saqlandi',issue:'Agentga berildi',take_back:'Omborga qabul qilindi',writeoff:'Hisobdan chiqarildi'}[st.kind],closeSheet);};
  };
  showSheet();draw();
}

      <button data-op="need" style="--q:${C.blue}"><span>${I('down')}</span><b>Tovar so‘rash</b></button><button data-op="return" style="--q:${C.orange}"><span>${I('undo')}</span><b>Qaytarish</b></button></div>
      <div class="hint">Mijozga faqat ombordan olgan tovaringizni topshira olasiz. Sotilmagan yoki brak tovarni omborga qaytaring.</div></div>
    <div class="c"><h3>Qo‘limdagi tovar</h3>${ps.map(p=>`<div class="tl">${box('box',p.stock>0?C.blue:C.red,1)}<span class="tx">${esc(p.name)}${p.free!==p.stock?`<br><small>qaytarishga band: ${num(p.stock-p.free)}</small>`:''}</span><b class="${p.stock<0?'bad':''}">${units(p.stock,p.block)}</b></div>`).join('')
      ||emptyBox('box','Qo‘lingizda tovar yo‘q')}</div>
    <div class="c"><h3>So‘nggi so‘rovlar <a data-go="mine">Barchasi</a></h3>${(S.requests||[]).slice(0,3).map(reqLine).join('')||emptyBox('list','So‘rov yo‘q')}</div>`;
  bindCommon(v);
}
function reqLine(r){const k=REQ[r.kind]||['box',C.gray,r.kind],st=RST[r.status]||[r.status,'p-mu'],p=product(r.pack)||{block:0};
  return `<div class="tl">${box(k[0],k[1],1)}<span class="tx"><b>${esc(r.name)}</b><br><small>${k[2]} #${r.id} · ${when(r.ts)}${r.note?' · '+esc(r.note):''}</small></span>
    <span style="text-align:right"><b>${units(r.qty,p.block)}</b><br><span class="pill ${st[1]}">${st[0]}</span></span></div>`;}
function aMine(v){
  const rs=S.requests||[];
  v.innerHTML=`<div class="c">${rs.map(reqLine).join('')||emptyBox('list','So‘rovlar yo‘q')}</div>
    <div class="two"><button class="btn" data-op="need">${I('down')}Tovar so‘rash</button><button class="btn g" data-op="return">${I('undo')}Qaytarish</button></div>`;
  bindCommon(v);
}

/* ---------- sheet & theme ---------- */
function showSheet(){$('sh').classList.add('on');$('ov').classList.add('on');try{tg&&tg.BackButton.show();}catch(e){}}
function openSheet(html,bind){const s=$('sh');s.innerHTML='<div class="grab"></div>'+html;showSheet();bind&&bind(s);}
function closeSheet(){$('sh').classList.remove('on');$('ov').classList.remove('on');try{tg&&tg.BackButton.hide();}catch(e){}}
$('ov').onclick=closeSheet;
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
function isDark(){const d=document.documentElement;return d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;}
function applyTheme(t){if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;}
function toggleTheme(){const t=isDark()?'light':'dark';applyTheme(t);try{localStorage.setItem('omborTheme',t);}catch(e){}render();}
try{applyTheme(localStorage.getItem('omborTheme')||(tg&&tg.colorScheme)||'');}catch(e){applyTheme(tg&&tg.colorScheme||'');}

/* ---------- start ---------- */
function splashDone(){const sp=$('sp');if(!sp)return;sp.classList.add('x');setTimeout(()=>sp.remove(),500);}
function splashFail(msg,retry){const sp=$('sp');if(!sp)return;sp.className='er';
  sp.innerHTML=`<div class="ercard"><b>Ombor panelini ochib bo‘lmadi</b><p></p>${retry?'<button class="btn" id="rt">Qayta urinish</button>':''}</div>`;
  sp.querySelector('p').textContent=msg;if(retry)$('rt').onclick=()=>{sp.className='';sp.innerHTML='<img src="/app/premium-kit/aibi/aibi-mark.svg?v=3" alt="AIBI"><small>AIBI WAREHOUSE</small><div class="ldbar"><i></i></div>';start();};}
function start(){load(true).then(splashDone).catch(e=>splashFail(e.message,true));}
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor(isDark()?'#0e1621':'#f1f2f6');}catch(e){}
  try{tg.BackButton.onClick(closeSheet);}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&!busy&&!$('sh').classList.contains('on'))load(true).catch(()=>{});});
if(!tg||!tg.initData)splashFail('Panelni Telegram botdagi «📱 Омбор Mini App» yoki «📦 Омбор сўрови» tugmasidan oching.',false);
else start();
</script>
</body>
</html>
