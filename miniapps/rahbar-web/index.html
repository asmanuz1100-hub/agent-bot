<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ASMAN · Rahbar paneli</title>
<link rel="icon" href="/app/premium-kit/emblem.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="app.css?v=53">
<meta name="theme-color" content="#F7F6F2">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('rw-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
</head>
<body>
<!-- Kirish -->
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-card" autocomplete="on">
    <img src="/app/premium-kit/logo.png" alt="ASMAN" class="login-logo">
    <h1>Rahbar paneli</h1>
    <p class="muted">Kompyuter uchun boshqaruv markazi</p>
    <label>Login<input id="lgLogin" name="username" autocomplete="username" required autofocus spellcheck="false" autocapitalize="off"></label>
    <label>Parol<input id="lgPass" name="password" type="password" autocomplete="current-password" required></label>
    <div id="lgErr" class="form-err" role="alert"></div>
    <button class="btn pri block" id="lgBtn">Kirish</button>
    <p class="hint">Login va parolni Telegram botdan oling: rahbar akkauntidan <code>/webparol</code> yozing.</p>
  </form>
</div>

<!-- Asosiy oyna: chapda grafit rail (amallar), yuqorida pill tablar (bo'limlar) -->
<div id="shell" class="shell" hidden>
  <aside class="rail" id="rail" aria-label="Tezkor amallar">
    <button class="rail-logo" id="railToggle" title="Panelni kengaytirish / yig‘ish" aria-expanded="false"><img src="/app/premium-kit/emblem.png" alt="ASMAN"><span class="lbl"><b>ASMAN</b><small>Rahbar</small></span></button>
    <div class="rail-items">
      <button class="rail-btn" id="railSearch" title="Qidirish (Ctrl K)"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="lbl">Qidirish</span></button>
      <button class="rail-btn" id="railFeed" title="Jonli lenta"><svg class="ico" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="lbl">Jonli lenta</span><i class="rail-dot" id="railDot" hidden></i></button>
      <button class="rail-btn" id="refreshBtn" title="Yangilash (R)"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 12A9 9 0 0 1 18.5 5.8L21 8"/><path d="M21 3v5h-5"/><path d="M3 21v-5h5"/></svg><span class="lbl">Yangilash</span></button>
      <button class="rail-btn" id="railStaff" title="Xodimlar"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14a6 6 0 0 1 3.5 6"/></svg><span class="lbl">Xodimlar</span></button>
      <button class="rail-btn" id="railSettings" title="Sozlamalar"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8 2 2 0 1 1-2.8 2.8 1.7 1.7 0 0 0-2.8 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.8-1.2 2 2 0 1 1-2.8-2.8A1.7 1.7 0 0 0 3.3 13a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.8 2 2 0 1 1 2.8-2.8A1.7 1.7 0 0 0 10 2.2a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.8 1.2 2 2 0 1 1 2.8 2.8A1.7 1.7 0 0 0 20.8 9a2 2 0 1 1 0 4 1.7 1.7 0 0 0-1.4 2z"/></svg><span class="lbl">Sozlamalar</span></button>
    </div>
    <div class="rail-foot">
      <button class="rail-btn" id="themeBtn" title="Yorug‘ / to‘q mavzu"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="lbl">Mavzu</span></button>
      <button class="rail-me" id="meBtn" title="Akkaunt"><span class="av" id="meAv"></span><span class="lbl"><b id="meName">—</b><small id="meRole">Rahbar</small></span></button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="top-row">
        <nav id="nav" class="tabs-nav" aria-label="Bo‘limlar"></nav>
        <div class="gsearch" role="search"><input id="gq" type="search" placeholder="Qidirish: mijoz, agent, telefon…" autocomplete="off" aria-label="Global qidiruv" aria-controls="gres"><kbd>Ctrl K</kbd><div id="gres" class="gres" role="listbox" hidden></div></div>
        <span id="updated" class="live"></span>
      </div>
      <div class="title-row"><div><h1 id="pageTitle">Asosiy</h1><small id="pageSub" class="muted"></small></div><div class="title-act" id="titleAct"></div></div>
    </header>
    <div id="page" class="page"></div>
  </main>
</div>

<!-- O'ng panel (mijoz / agent kartasi) -->
<div id="drawerOv" class="drawer-ov"></div>
<aside id="drawer" class="drawer" aria-hidden="true"><button class="drawer-x icon-btn" id="drawerX" aria-label="Yopish"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button><div id="drawerBody"></div></aside>

<!-- Modal -->
<div id="modalOv" class="modal-ov" hidden><div class="modal" role="dialog" aria-modal="true"><div id="modalBody"></div></div></div>
<div id="toast" class="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="app.js?v=54"></script>
</body>
</html>
