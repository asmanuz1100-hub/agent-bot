<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AIBI Dashboard</title>
<link rel="icon" id="favicon" href="/app/premium-kit/aibi/apps/dashboard.ico?v=2" sizes="any"><link rel="icon" type="image/png" sizes="192x192" href="/app/premium-kit/aibi/apps/dashboard-192.png?v=2"><link rel="apple-touch-icon" href="/app/premium-kit/aibi/apps/dashboard-180.png?v=2"><link rel="manifest" href="manifest.webmanifest"><meta name="application-name" content="AIBI Dashboard"><meta name="apple-mobile-web-app-title" content="AIBI Dashboard">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="app.css?v=101">
<meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('rw-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
</head>
<body>
<!-- Kirish -->
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-card" autocomplete="on">
    <div class="login-brand"><span class="brand-mark" id="lgMark"></span><b id="lgBrand"></b></div>
    <h1>AIBI Dashboard</h1>
    <p class="muted">Savdo, mijozlar, agentlar va moliya — bitta joyda</p>
    <label>Login<input id="lgLogin" name="username" autocomplete="username" required autofocus spellcheck="false" autocapitalize="off"></label>
    <label>Parol<input id="lgPass" name="password" type="password" autocomplete="current-password" required></label>
    <label id="lgCodeRow" hidden>Telegram’ga kelgan kod<input id="lgCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" spellcheck="false"></label>
    <div id="lgErr" class="form-err" role="alert"></div>
    <button class="btn pri block" id="lgBtn"><span>Kirish</span></button>
    <p class="hint">Login va parolni Telegram botdan oling: rahbar akkauntidan <code>/webparol</code> yozing.</p>
  </form>
</div>

<!-- Asosiy oyna: chapda shisha sidebar (bo'limlar), yuqorida amallar paneli -->
<div id="shell" class="shell" hidden>
  <div class="side-ov" id="sideOv"></div>
  <aside class="rail" id="rail" aria-label="Asosiy navigatsiya">
    <div class="side-head">
      <span class="brand-mark" id="brandMark"></span>
      <span class="lbl brand-txt"><b id="brandName">AIBI Dashboard</b><small id="brandSub">Smart Business Platform</small></span>
      <button class="side-tog icon-btn ghost" id="railToggle" aria-label="Panelni yig‘ish" data-tip="Panelni yig‘ish / kengaytirish" aria-expanded="true"></button>
    </div>
    <button class="side-search" id="railSearch" aria-label="Qidirish (Ctrl K)" data-tip="Qidirish (Ctrl K)"></button>
    <nav id="nav" class="side-nav" aria-label="Bo‘limlar"></nav>
    <div class="rail-foot">
      <button class="rail-me" id="meBtn" aria-label="Akkaunt va sozlamalar"><span class="av" id="meAv"></span><span class="lbl"><b id="meName">—</b><small id="meRole">—</small></span></button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="top-row">
        <button class="icon-btn ghost menu-btn" id="menuBtn" aria-label="Menyu" data-tip="Menyu"></button>
        <div class="gsearch" role="search"><input id="gq" type="search" placeholder="Qidirish: mijoz, agent, telefon…" autocomplete="off" aria-label="Global qidiruv" aria-controls="gres"><kbd>Ctrl K</kbd><div id="gres" class="gres" role="listbox" hidden></div></div>
        <span class="grow"></span>
        <span id="updated" class="live" aria-live="polite"></span>
        <button class="as-btn" id="aiBtn" aria-label="Yordamchi (Ctrl J)" aria-expanded="false"><span class="orb sm" aria-hidden="true"><i></i><i></i><i></i></span><span class="lbl">Yordamchi</span></button>
        <button class="icon-btn ghost" id="railFeed" aria-label="Jonli lenta" data-tip="Jonli lenta"><i class="rail-dot" id="railDot" hidden></i></button>
        <button class="icon-btn ghost" id="refreshBtn" aria-label="Yangilash (R)" data-tip="Yangilash (R)"></button>
        <button class="icon-btn ghost" id="themeBtn" aria-label="Mavzuni almashtirish" data-tip="Mavzu"></button>
      </div>
      <div class="title-row"><div><h1 id="pageTitle">Asosiy</h1><small id="pageSub" class="muted"></small></div><div class="title-act" id="titleAct"></div></div>
    </header>
    <div id="page" class="page"></div>
  </main>
</div>

<!-- O'ng panel (mijoz / agent kartasi) -->
<div id="drawerOv" class="drawer-ov"></div>
<aside id="drawer" class="drawer" inert aria-label="Batafsil ma’lumot"><button class="drawer-x icon-btn" id="drawerX" aria-label="Yopish"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button><div id="drawerBody"></div></aside>

<!-- Yordamchi (Siri uslubi): suzuvchi shisha panel + ekran chetidagi nur -->
<div class="as-edge" id="asEdge" aria-hidden="true"></div>
<section class="as-panel" id="asPanel" role="dialog" aria-modal="false" aria-label="Yordamchi" hidden>
  <header class="as-head"><span class="orb" id="asOrb" aria-hidden="true"><i></i><i></i><i></i></span><div class="as-title"><b>Yordamchi</b><small id="asState">Savdo, agentlar, ombor va kassa bo‘yicha</small></div><button class="icon-btn ghost" id="asClose" aria-label="Yopish" data-tip="Yopish"></button></header>
  <div class="as-log" id="aiLog" aria-live="polite"></div>
  <div class="as-hints" id="aiHints"></div>
  <form class="as-input" id="aiForm"><textarea id="aiQ" rows="1" maxlength="600" placeholder="Savolingiz…" aria-label="Savol"></textarea><button type="button" class="as-ic" id="aiSpk" aria-label="Javobni ovoz bilan o‘qish"></button><button type="button" class="as-mic" id="aiMic" aria-label="Ovoz bilan so‘rash"></button><button class="as-send" id="aiSend" aria-label="Yuborish"></button></form>
</section>

<!-- Modal -->
<div id="modalOv" class="modal-ov" hidden><div class="modal" role="dialog" aria-modal="true"><div id="modalBody"></div></div></div>
<div id="toast" class="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="app.js?v=103"></script><script src="/app/aibi-rahbar/assistant.js?v=20261029-v10"></script>
</body>
</html>
