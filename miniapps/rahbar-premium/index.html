function initYmap(){
  if(typeof L==='undefined'){ymap.innerHTML='<div id="ymap-ld">Xarita yuklanmadi (internet aloqasini tekshiring)</div>';return}
  document.getElementById('ymap-ld')?.remove();
  ymapObj=L.map('ymap',{zoomControl:true,attributionControl:true,scrollWheelZoom:false}).setView(AG_LL[0],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(ymapObj);
  ymapPMs=AG.map((a,i)=>{
    const icon=L.divIcon({className:'',html:`<div class="ymap-pin${i==0?' on':''}"><b>${a[0][0]}</b></div>`,iconSize:[38,38],iconAnchor:[19,34]});
    const m=L.marker(AG_LL[i],{icon}).addTo(ymapObj);
    m.on('click',()=>selA(i));return m});
  const CC=['#16b364','#16b364','#f0384f','#f59e0b','#16b364'];
  ymapCPMs=CL.map((c,i)=>{
    const icon=L.divIcon({className:'',html:`<div class="ymap-dot" style="background:${CC[i]}"></div>`,iconSize:[16,16],iconAnchor:[8,8]});
    const m=L.marker(CL_LL[i],{icon}).addTo(ymapObj);
    m.bindPopup(`<div class="ymap-bln"><b>${c[0]}</b><small>📍 ${c[1]} · Qarz: ${c[3].toFixed(2)} $</small><button onclick="ymapRoute(${i%3})">➤ Marshrutni ochish</button></div>`);
    return m});
}

const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){
  tg.ready();
  tg.expand();
  try{tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}
  const root=document.documentElement;
  function syncTheme(){
    root.dataset.theme=tg.colorScheme==='dark'?'dark':'light';
    const bg=getComputedStyle(root).getPropertyValue('--bg').trim()||'#eef3fb';
    try{tg.setHeaderColor&&tg.setHeaderColor(tg.colorScheme==='dark'?'#0a1226':'#04143d')}catch(e){}
    try{tg.setBackgroundColor&&tg.setBackgroundColor(bg)}catch(e){}
  }
  syncTheme();
  tg.onEvent('themeChanged',syncTheme);
  // Telegram's own safe-area (covers the app header / home indicator on top of the CSS env() fallback already in place)
  function syncInsets(){
    const s=tg.safeAreaInset||{},c=tg.contentSafeAreaInset||{};
    root.style.setProperty('--tg-safe-top',((s.top||0)+(c.top||0))+'px');
    root.style.setProperty('--tg-safe-bottom',((s.bottom||0)+(c.bottom||0))+'px');
  }
  syncInsets();
  tg.onEvent('viewportChanged',syncInsets);
  tg.onEvent('safeAreaChanged',syncInsets);
  // Telegram's Back Button drives the product-sheet close instead of only the overlay tap
  const closeS0=closeS;
