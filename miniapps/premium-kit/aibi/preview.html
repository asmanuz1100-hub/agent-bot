<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIBI brand assets</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="aibi.css">
<style>body{margin:0;font-family:var(--aibi-font);background:#0B1020;color:#F8FAFC;padding:24px}h2{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#94A3B8;margin:28px 0 12px}
.row{display:flex;flex-wrap:wrap;gap:18px;align-items:end}.card{background:#0F172A;border:1px solid #1E293B;border-radius:18px;padding:18px}.light{background:#F8FAFC;color:#0F172A}
.sw{width:96px}.sw i{display:block;height:64px;border-radius:14px}.sw small{display:block;margin-top:6px;font-size:12px;color:#94A3B8}img{display:block}small.c{font-size:11px;color:#94A3B8;text-align:center;margin-top:6px;display:block}
.grad{height:56px;border-radius:14px;background:var(--aibi-aurora)}</style></head><body>
<span class="aibi-wm lg"><img src="aibi-mark.svg" alt="">AIBI</span><div class="aibi-sub" style="margin-top:6px">Smart Business Platform</div>
<h2>Logotip</h2><div class="row"><div class="card"><img src="aibi-logo-dark.svg" style="height:110px" alt="AIBI"></div><div class="card light"><img src="aibi-logo-light.svg" style="height:110px" alt="AIBI"></div><div class="card"><img src="aibi-mark.svg" style="width:110px" alt=""></div></div>
<h2>Ilova ikonkalari</h2><div class="row">
<div><img src="aibi-icon-dark-1024.png" width="160" alt=""><small class="c">1024 · dark</small></div><div><img src="aibi-icon-light-1024.png" width="160" alt=""><small class="c">1024 · light</small></div>
<div><img src="aibi-icon-dark-180.png" width="90" alt=""><small class="c">180</small></div><div><img src="aibi-icon-dark-120.png" width="60" alt=""><small class="c">120</small></div><div><img src="aibi-icon-dark-64.png" width="64" alt=""><small class="c">64</small></div><div><img src="aibi-icon-dark-32.png" width="32" alt=""><small class="c">32</small></div><div><img src="aibi-icon-dark-16.png" width="16" alt=""><small class="c">16</small></div>
<div style="background:#0F172A;border-radius:50%;overflow:hidden;width:120px;height:120px"><img src="aibi-adaptive-foreground.png" width="120" alt=""></div><small class="c">Android adaptive</small></div>
<h2>Ranglar</h2><div class="row">
<div class="sw"><i style="background:#3882F6"></i><small>#3882F6 Blue</small></div><div class="sw"><i style="background:#6366F1"></i><small>#6366F1 Violet</small></div><div class="sw"><i style="background:#A855F7"></i><small>#A855F7 Purple</small></div><div class="sw"><i style="background:#EC4899"></i><small>#EC4899 Pink</small></div><div class="sw"><i style="background:#0F172A;border:1px solid #334155"></i><small>#0F172A Navy</small></div><div class="sw"><i style="background:#F8FAFC"></i><small>#F8FAFC White</small></div></div>
<h2>Aurora gradient</h2><div class="grad"></div>
<h2>Splash</h2><img src="aibi-splash.png" width="180" style="border-radius:18px" alt="">
</body></html>
