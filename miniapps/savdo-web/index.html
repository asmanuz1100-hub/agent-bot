<!doctype html>
<html lang="uz" class="aibi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>AIBI Savdo Web</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* savdo-web: savdo mini-ilovasining kompyuter (brauzer) varianti — login/parol, chap menyu, ikki ustunli kassa. */
/* Rahbar Premium bilan bir xil dizayn tizimi (ranglar, kartalar, ikonkalar, navigatsiya). */
:root{--bg:#f1f2f6;--card:#fff;--tx:#17212b;--mu:#7b8794;--line:#e7e9ef;--pri:#2a8bf2;--ok:#16b364;--bad:#f0384f;--warn:#f59e0b;--soft:#f3f5f9;--k:#1f6fd1;
  --sh:0 1px 0 #fff inset,0 14px 30px -18px #0a2a8a40;--grad:linear-gradient(135deg,#6bb4ff,#2a8bf2 45%,#1f6fd1);--wm:brightness(0);
  --safe-top:max(env(safe-area-inset-top,0px),var(--tg-safe-top,0px));--safe-bot:max(env(safe-area-inset-bottom,0px),var(--tg-safe-bottom,0px))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1621;--card:#17212b;--tx:#f5f7fa;--mu:#8b98a5;--line:#242f3d;--soft:#1e2a38;--k:#7db6f5;--sh:0 10px 24px -16px #000a;--wm:none}}
:root[data-theme="dark"]{--bg:#0e1621;--card:#17212b;--tx:#f5f7fa;--mu:#8b98a5;--line:#242f3d;--soft:#1e2a38;--k:#7db6f5;--sh:0 10px 24px -16px #000a;--wm:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Manrope,Inter,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.08px;display:flex;justify-content:center;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{touch-action:manipulation}
b,h1,h2,h3{font-weight:800}
.app{width:100%;max-width:440px;min-height:100vh;padding-bottom:calc(112px + var(--safe-bot))}
section{display:none}section.on{display:block;animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
ico{display:inline-grid;place-items:center;vertical-align:-.16em;line-height:0}ico svg{width:1.1em;height:1.1em}
/* header */
.hd{padding:calc(16px + var(--safe-top)) 16px 6px}
.br{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.lg{display:flex;flex-direction:column;align-items:flex-start;gap:2px}.lg img{height:22px;display:block;filter:var(--wm)}
.lg small,.k{color:var(--k);font-size:9px;font-weight:700;letter-spacing:2.4px;padding-left:1px}
.rt{display:flex;gap:10px}
.rt button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--tx);cursor:pointer;font-size:18px}
.rt button ico svg{width:19px;height:19px}
.rt button.pf{background:var(--grad);color:#fff;font-weight:700;font-size:15px}
.rt button.spin ico{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.gr{margin:0 0 14px 2px}.gr small{display:block;font-size:12px;letter-spacing:.3px}.gr b{font-size:21px;letter-spacing:-.4px}.gr b ico{color:var(--tx);margin-left:4px}
.hero{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--sh);margin-bottom:6px}
.hero>:not(.mt):not(.live){position:relative;z-index:1}
.mt{position:absolute;right:0;bottom:0;width:78%;height:100%;pointer-events:none;opacity:.1}
.hero .k{font-size:11px;display:block}
.hero h1{margin:4px 0;font-size:25px;letter-spacing:-.6px}.hero h1 u{text-decoration:none;font-size:14px;color:var(--pri);font-weight:800;letter-spacing:0}
.hero p{margin:0 0 12px;font-size:13px}
.live{position:absolute;right:12px;top:12px;z-index:2;font-size:11px;background:#34c7591f;border:1px solid #34c75966;color:#1c9b43;padding:4px 10px;border-radius:20px;animation:pl 2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 7px #16b36412}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hb{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:11px}.hb small{font-size:11px;color:var(--mu);display:block}.hb b{font-size:19px;display:block;margin-top:3px}
/* body */
.bd{padding:12px 14px 0}
.c{background:linear-gradient(var(--card),color-mix(in srgb,var(--card) 99%,var(--pri)));border:1px solid var(--line);border-radius:22px;padding:13px;margin-bottom:12px;box-shadow:var(--sh)}
.c h3{margin:0 0 10px;font-size:14.5px;letter-spacing:.1px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.c h3 a,.lnk{font-size:12px;color:var(--pri);font-weight:700;cursor:pointer;background:none;border:0;padding:0}
.kp{display:flex;gap:10px;align-items:center;cursor:pointer}
.ic{--a:#2a8bf2;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;
  background:linear-gradient(160deg,#ffffff4d,#fff0 60%),var(--a);box-shadow:0 6px 12px -7px var(--a)}
.ic ico svg{width:22px;height:22px;stroke-width:1.9}
.ic.s{width:36px;height:36px;border-radius:12px}.ic.s ico svg{width:18px;height:18px}
.kp small{font-size:12px;color:var(--mu);display:block}.kp b{font-size:21px;letter-spacing:-.4px;display:block}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wa{color:#c77c00}.mu{color:var(--mu)}
.al{--t:#f0384f;display:flex;gap:10px;align-items:center;border-radius:14px;padding:10px;margin-bottom:8px;cursor:pointer;
  background:linear-gradient(90deg,color-mix(in srgb,var(--t) 14%,transparent),color-mix(in srgb,var(--t) 3%,transparent));border:1px solid color-mix(in srgb,var(--t) 18%,transparent)}
.al:last-child{margin-bottom:0}.al.y{--t:#f59e0b}.al.g{--t:#16b364}
.al b{font-size:13.5px;display:block}.al small{font-size:12px;color:var(--mu)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);border-radius:18px;padding:12px 4px;text-align:center;font-size:12px;cursor:pointer;color:var(--mu)}
.qa button:active{transform:scale(.94)}
.qa button span{width:44px;height:44px;margin:0 auto 4px;border-radius:14px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(160deg,#ffffff4d,#fff0 60%),var(--q,#2a8bf2);box-shadow:0 8px 14px -8px var(--q,#2a8bf2)}
.qa button span ico svg{width:22px;height:22px;stroke-width:1.9}
.qa button b{display:block;font-size:13px;color:var(--tx);margin-top:4px}
.ch{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}.ch::-webkit-scrollbar{display:none}
.ch button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer}
.ch button b{font-size:12px;margin-left:3px;opacity:.75}
.ch button.on{background:var(--grad);color:#fff;box-shadow:0 8px 18px -8px #1f6fd1cc}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:4px;margin:2px 0 12px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:10px 6px;border-radius:12px;font-size:13.5px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 8px 18px -8px #1f6fd1cc}
.row{display:flex;align-items:center;gap:12px;padding:11px;background:linear-gradient(var(--card),color-mix(in srgb,var(--card) 99%,var(--pri)));
  border:1px solid var(--line);border-radius:22px;margin-bottom:10px;cursor:pointer;box-shadow:var(--sh);transition:transform .15s}
.row:active{transform:scale(.98)}
.row .t{flex:1;min-width:0}.row .t b{font-size:14.5px;display:block;overflow-wrap:anywhere}.row .t small{font-size:12px;color:var(--mu);display:block;margin-top:2px}
.am{text-align:right;flex:none}.am b{font-size:15px;display:block;margin-bottom:3px}.am small{font-size:12px;color:var(--mu)}
.av{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;background:linear-gradient(135deg,#5aa2ff,#1f4fd8);box-shadow:0 10px 18px -10px #17212baa}
.pill{font-size:11.5px;font-weight:600;letter-spacing:.2px;padding:4px 9px;border-radius:20px;display:inline-block;white-space:nowrap;--p:#2a8bf2;
  color:var(--p);background:color-mix(in srgb,var(--p) 12%,transparent);border:1px solid color-mix(in srgb,var(--p) 22%,transparent)}
.p-ok{--p:#16b364}.p-bad{--p:#f0384f}.p-wa{--p:#d48806}.p-pri{--p:#2a8bf2}.p-mu{--p:#7b8794}
.bar{height:5px;border-radius:5px;background:var(--soft);margin-top:8px;overflow:hidden}.bar u{display:block;height:100%;border-radius:5px;background:var(--grad)}
.bar u.lo{background:linear-gradient(90deg,#ffb84d,#f59e0b)}
.srch{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px;margin-bottom:12px;color:var(--mu);box-shadow:var(--sh)}
.srch ico svg{width:19px;height:19px}
.srch input{flex:1;border:0;outline:0;background:none;font-size:14px;min-width:0;color:var(--tx)}
.empty{text-align:center;color:var(--mu);padding:20px 10px;font-size:14px}.empty .ic{margin:0 auto 10px;--a:#8b98a5}
.od{background:linear-gradient(var(--card),color-mix(in srgb,var(--card) 99%,var(--pri)));border:1px solid var(--line);border-radius:22px;padding:13px;margin-bottom:12px;box-shadow:var(--sh)}
.od .hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.od .hdr b{font-size:15px}.od .hdr small{display:block;color:var(--mu);font-size:12px;margin-top:3px}
.od .hdr small ico{margin-right:3px}
.it{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:13.5px}
.it:first-of-type{margin-top:8px}
.it span{min-width:0;overflow-wrap:anywhere}.it em{font-style:normal;font-size:12px;white-space:nowrap;font-weight:600}
.note{background:var(--soft);border-radius:12px;padding:8px 10px;font-size:12.5px;margin-top:8px;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:0;background:var(--grad);color:#fff;text-align:center;padding:13px;border-radius:14px;font-weight:800;font-size:14px;cursor:pointer;min-height:46px;box-shadow:0 8px 18px -10px #1f6fd1cc}
.btn ico{margin-right:6px}
.btn.g{background:var(--soft);color:var(--pri);box-shadow:none}.btn.r{background:#f0384f1a;color:var(--bad);box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#34c759,#16b364);box-shadow:0 8px 18px -10px #16b364cc}.btn.x{flex:0 0 52px}.btn.x ico{margin:0}
.btn:disabled{opacity:.5;cursor:default}
.tl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.tl:last-child{border-bottom:0}
.tl small{color:var(--mu)}.tl .tx{flex:1;min-width:0;overflow-wrap:anywhere}.tl>b{white-space:nowrap}
.more{display:block;width:100%;margin:4px 0 12px}
.ro{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--pri) 10%,transparent);border:1px solid color-mix(in srgb,var(--pri) 20%,transparent);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:12.5px}
/* forms */
label.f{display:block;font-size:12px;color:var(--mu);margin:12px 0 6px;font-weight:600}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:12px;font-size:15px;outline:0;color:var(--tx)}
.inp:focus{border-color:var(--pri)}
textarea.inp{min-height:70px;resize:vertical}
.qty{display:flex;gap:8px;align-items:stretch}
.qty button{width:48px;border:0;border-radius:14px;background:var(--soft);color:var(--pri);font-size:22px;font-weight:800;cursor:pointer}
.qty input{flex:1;text-align:center;font-size:20px;font-weight:800;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.hint{font-size:12.5px;color:var(--mu);margin-top:6px}.hint b{color:var(--tx)}
/* nav, sheet, toast */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-bot));width:min(412px,calc(100% - 24px));display:flex;padding:8px;z-index:9;border-radius:30px;
  background:color-mix(in srgb,var(--card) 90%,transparent);border:1px solid var(--line);box-shadow:0 14px 32px -14px #17212b55;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#ni{position:absolute;top:8px;bottom:8px;left:0;width:60px;border-radius:22px;background:var(--grad);box-shadow:0 10px 24px -8px #1f6fd1cc,inset 0 1px 0 #ffffff88;transition:transform .5s cubic-bezier(.3,1.35,.5,1),width .3s}
nav button{position:relative;z-index:1;flex:1;border:0;background:none;color:var(--mu);font-size:11px;font-weight:700;padding:7px 2px;border-radius:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button span{line-height:0}nav button span ico svg{width:22px;height:22px}
nav button.on{color:#fff;font-weight:800}
nav button i{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-style:normal;font-size:10.5px;font-weight:800;display:grid;place-items:center}
#ov{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:.3s;z-index:20}#ov.on{opacity:1;pointer-events:auto}
#sh{position:fixed;left:50%;bottom:0;width:min(440px,100%);transform:translate(-50%,105%);transition:.4s cubic-bezier(.2,.9,.3,1);background:var(--card);color:var(--tx);
  border-radius:26px 26px 0 0;padding:10px 18px calc(22px + var(--safe-bot));z-index:21;max-height:90vh;overflow:auto}
#sh.on{transform:translate(-50%,0)}
#sh .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
#sh h2{margin:0 0 4px;font-size:19px;display:flex;align-items:center;gap:10px}#sh .sub{color:var(--mu);font-size:13px;margin-bottom:6px}
#ts{position:fixed;left:50%;top:calc(12px + var(--safe-top));transform:translate(-50%,-180%);background:#17212b;color:#fff;padding:11px 16px;border-radius:16px;font-size:13.5px;
  z-index:30;transition:.4s;box-shadow:0 8px 24px #0006;max-width:92%;border:1px solid #2a8bf255}
#ts.on{transform:translate(-50%,0)}#ts.err{background:#8f1d2c;border-color:#f0384f66}
/* splash */
#sp{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
  background:radial-gradient(120% 70% at 85% 0%,#2a6bff66,transparent 60%),linear-gradient(170deg,#030b24,#061a55 55%,#0a2a8a);transition:opacity .45s,visibility .45s}
#sp img{width:92px;height:92px;animation:pop .7s cubic-bezier(.3,1.5,.5,1) both}
#sp small{margin-top:12px;font-size:10px;letter-spacing:4px;opacity:.75}
#sp .ldbar{width:120px;height:3px;border-radius:3px;background:#ffffff22;overflow:hidden;margin-top:18px}
#sp .ldbar i{display:block;width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,#6bb4ff,#2a8bf2);animation:ldx 1.1s cubic-bezier(.4,0,.2,1) infinite}
@keyframes ldx{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
#sp.x{opacity:0;visibility:hidden}
#sp.er{background:var(--bg);color:var(--tx);padding:20px}
.ercard{width:min(100%,400px);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:12px;box-shadow:var(--sh)}
.ercard b{font-size:18px}.ercard p{margin:0;color:var(--mu);font-size:14px}
@media (min-width:760px){.app{max-width:760px}}
/* login */
.lgf{display:grid;gap:4px;width:min(100%,380px);background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 30px 60px -30px #000c;animation:pop .5s cubic-bezier(.3,1.4,.5,1) both}
.lgf h2{margin:0;font-size:20px}.lgf p{margin:0 0 6px;color:var(--mu);font-size:13px}.lgf .btn{margin-top:14px}
.lgf .er{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
#sp.lg-on>img,#sp.lg-on>small,#sp.lg-on>.ldbar{display:none}
/* kompyuter: chap menyu + keng kontent; kassa ikki ustunda (mahsulotlar | savatcha va to'lov) */
@media (min-width:1100px){
  body{justify-content:flex-start}
  .app{max-width:none;padding:0 28px 32px 268px}
  nav{left:16px;top:16px;bottom:16px;transform:none;width:228px;flex-direction:column;justify-content:flex-start;gap:4px;padding:84px 10px 10px;border-radius:26px}
  nav::before{content:"AIBI · SAVDO";position:absolute;top:30px;left:24px;font-size:11px;font-weight:800;letter-spacing:2.6px;color:var(--k)}
  #ni{display:none}
  nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;font-size:14px;border-radius:16px;transition:background .2s,color .2s}
  nav button:hover{background:var(--soft);color:var(--tx)}
  nav button.on{background:var(--grad);color:#fff;box-shadow:0 10px 24px -10px #1f6fd1cc}
  nav button i{position:static;margin-left:auto}
  .hd{padding:24px 6px 6px}.bd{padding:12px 6px 0}
  .hero{max-width:760px}
  .bd.sell{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:0 20px;align-items:start}
  .bd.sell>.srch{grid-column:1;grid-row:1}
  .bd.sell>#plist{grid-column:1;grid-row:2/span 20;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .bd.sell>#plist .row{margin:0}
  .bd.sell>.c,.bd.sell>#payC{grid-column:2}
  .row{transition:transform .15s,box-shadow .2s}.row:hover{transform:translateY(-2px);box-shadow:0 18px 30px -20px #0a2a8a66}
  #sh{left:auto;right:0;top:0;bottom:0;width:480px;max-height:none;border-radius:26px 0 0 26px;transform:translateX(105%)}
  #sh.on{transform:none}#sh .grab{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.pimg{width:44px;height:44px;border-radius:14px;object-fit:contain;padding:2px;box-sizing:border-box;flex:none;background:#fff;border:1px solid var(--line)}
.pbig{display:block;width:100%;max-height:260px;object-fit:contain;border-radius:16px;background:#fff;margin:10px 0 6px;cursor:zoom-in}
.pfull{position:fixed;inset:0;z-index:9999;background:#000d;display:flex;align-items:center;justify-content:center;padding:16px}.pfull img{max-width:100%;max-height:100%;border-radius:14px}
.pact{display:flex;gap:8px;margin:6px 0 10px}.pact label,.pact button{flex:1;text-align:center}.pact input{display:none}
</style>
<link rel="icon" href="/app/premium-kit/aibi/favicon.ico?v=3" sizes="any"><link rel="icon" type="image/svg+xml" href="/app/premium-kit/aibi/aibi-icon-dark.svg?v=3"><link rel="apple-touch-icon" href="/app/premium-kit/aibi/aibi-icon-dark-180.png?v=3"><link rel="stylesheet" href="/app/premium-kit/aibi/aibi.css?v=1">

<body>
<div class="app" id="app"></div>
<nav id="nav" aria-label="Bo‘limlar"><i id="ni"></i></nav>
<div id="ov"></div>
<div id="sh" role="dialog" aria-modal="true"></div>
<div id="ts" role="status" aria-live="polite"></div>
<div id="sp" role="status" aria-label="Yuklanmoqda"><img src="/app/premium-kit/aibi/aibi-mark.svg?v=3" alt="AIBI"><small>AIBI · SAVDO</small><div class="ldbar"><i></i></div></div>
<script>
'use strict';
const tg=null;
let TOKEN='';try{TOKEN=localStorage.getItem('savdoWebToken')||'';}catch(e){}
function setToken(t){TOKEN=t||'';try{t?localStorage.setItem('savdoWebToken',t):localStorage.removeItem('savdoWebToken');}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function when(ts){const d=new Date(ts*1000),now=new Date(),t=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime(),diff=Math.round((day(now)-day(d))/864e5);
  return diff===0?`bugun ${t}`:diff===1?`kecha ${t}`:d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})+' '+t;}
function initials(s){return String(s||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';}
function haptic(type){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred(type);}catch(e){}}

const emptyBox=(icon,text)=>`<div class="empty">${box(icon,C.gray)}${text}</div>`;
const usd=n=>{n=Number(n)||0;return (n<0?'−':'')+'$'+Math.abs(n).toLocaleString('ru-RU',{minimumFractionDigits:Math.abs(n)%1?2:0,maximumFractionDigits:2});};

let S=null,tab=null,busy=false,Q=null,qErr='',qTimer=0,pq='',cq='',clientsList=null;

function newCart(){return {client:null,items:[],dmode:'pct',discount:'',method:'cash_usd',paid:'',paidUzs:'',rate:'',note:'',rid:newRid()};}

async function api(action,payload={}){
  let r;
  try{r=await fetch('/api/shop',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify({action,...payload})});}
  catch(e){throw Error('Internet aloqasi yo‘q. Qayta urinib ko‘ring.');}
  let j={};try{j=await r.json();}catch(e){}
  if(r.status===401){setToken('');showLogin(j.error||'Sessiya tugadi. Qayta kiring.');throw Error(j.error||'Sessiya tugadi.');}
  if(!r.ok)throw Error(j.error||'So‘rov bajarilmadi. Qayta urinib ko‘ring.');
  return j;
}
async function load(quiet){
  const b=$('rf');if(b)b.classList.add('spin');
  try{S=await api('dashboard');if(!cart.rate&&S.rate)cart.rate=String(S.rate);render();}
  catch(e){if(!quiet)toast(e.message,false);throw e;}
  finally{const b2=$('rf');if(b2)b2.classList.remove('spin');}
}
async function act(action,payload,okMsg,after){
  if(busy)return null;busy=true;
  const locked=[...document.querySelectorAll('#sh .btn:not(:disabled),#bd .btn:not(:disabled)')];locked.forEach(b=>b.disabled=true);
  try{const r=await api(action,payload);if(r.me)S=r;toast(okMsg);after&&after(r);render();return r;}
  catch(e){toast(e.message,false);return null;}
  finally{busy=false;locked.forEach(b=>b.disabled=false);}
}

function tabs(){const t=[['sell','cart','Sotuv'],['history','receipt','Tarix'],['clients','users','Mijozlar']];
  if(can('prices'))t.push(['prices','tag','Narxlar']);
  if(admin())t.push(['team','worker','Jamoa']);else t.push(['cash','wallet','Kassa']);
  return t;}
function go(t){tab=t;closeSheet();render();scrollTo(0,0);}
function moveNi(){const nav=$('nav'),b=nav.querySelector('button.on'),ni=$('ni');if(!b)return;ni.style.width=b.offsetWidth+'px';ni.style.transform=`translate3d(${b.offsetLeft}px,0,0)`;}
addEventListener('resize',moveNi);
function render(){
  if(!S)return;
  const ts=tabs();if(!tab||!ts.some(x=>x[0]===tab))tab=ts[0][0];
  const nav=$('nav');nav.querySelectorAll('button').forEach(b=>b.remove());
  const cnt=cart.items.reduce((s,i)=>s+i.qty,0);
  nav.insertAdjacentHTML('beforeend',ts.map(([k,ic,l])=>`<button class="${k===tab?'on':''}" data-t="${k}" aria-label="${esc(l)}"><span>${I(ic)}</span>${esc(l)}${k==='sell'&&cnt?`<i>${cnt>99?'99+':cnt}</i>`:''}</button>`).join(''));
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.t));
  requestAnimationFrame(moveNi);
  $('app').innerHTML=`<section class="on">${header()}<div class="bd${tab==='sell'?' sell':''}" id="bd"></div></section>`;
  ({sell:vSell,history:vHistory,clients:vClients,cash:vCash,prices:vPrices,team:vTeam})[tab]($('bd'));
  $('rf').onclick=()=>load().catch(()=>{});
  $('th').onclick=toggleTheme;
  $('pf').onclick=()=>openSheet(`<h2>${box('user',C.blue)}${esc(S.me.name)}</h2><div class="sub">${roleName()} · ID ${esc(S.me.id)}</div>

      <h3 style="margin:12px 0 4px;font-size:14px">Mening ruxsatlarim</h3>${Object.entries(S.permLabels||{}).map(([k,l])=>`<div class="tl"><span class="tx">${esc(l)}</span><b class="${can(k)?'ok':'mu'}">${can(k)?'ha':'yo‘q'}</b></div>`).join('')}`}
    <div class="tl"><span class="tx">Kassa kursi</span><b>${S.rate?num(S.rate)+' so‘m':'belgilanmagan'}</b></div>
    <div class="acts"><button class="btn r" id="lo">Chiqish</button><button class="btn g" id="cl">Yopish</button></div>`,s=>{s.querySelector('#cl').onclick=closeSheet;s.querySelector('#lo').onclick=logout;});

/* ---------- Sotuv (savatcha) ---------- */
function cartPayload(){
  const p={clientId:cart.client?cart.client.id:null,items:cart.items.map(i=>({pack:i.pack,qty:i.qty,...(i.price!=null&&i.price!==''?{price:i.price}:{})})),note:cart.note};
  if(cart.discount!==''&&Number(cart.discount)>0)p[cart.dmode==='pct'?'discountPct':'discount']=cart.discount;
  return p;
}
function requote(){
  clearTimeout(qTimer);
  if(!cart.items.length){Q=null;qErr='';drawTotals();return;}
  qTimer=setTimeout(async()=>{try{Q=(await api('quote',cartPayload())).quote;qErr='';}catch(e){qErr=e.message;}drawTotals();},250);
}
function vSell(v){
  const c=cart.client,ps=(S.products||[]).filter(p=>!pq||p.name.toLowerCase().includes(pq.toLowerCase()));
  const ptype=c?c.priceType:'retail';
  v.innerHTML=`<div class="c"><h3>Mijoz ${c?'<a id="cc">Almashtirish</a>':''}</h3>
      ${c?`<div class="tl">${box('user',C.blue,1)}<span class="tx"><b>${esc(c.name)}</b><br><small>${esc(c.phone||'')} · <span class="pill ${PT[ptype][1]}">${PT[ptype][0]} narx</span></small></span><b class="${c.debtUsd>0?'bad':'mu'}">${c.debtUsd>0?'qarz '+usd(c.debtUsd):'qarz yo‘q'}</b></div>`
        :`<div class="tl">${box('store',C.gray,1)}<span class="tx"><b>Chakana xaridor</b><br><small>faqat to‘liq to‘lov · qarzga berish uchun mijozni tanlang</small></span></div>
          <div class="acts"><button class="btn g" id="pick">${I('search')}Mijoz tanlash</button>${can('clients')?`<button class="btn g" id="newc">${I('uplus')}Yangi mijoz</button>`:''}</div>`}</div>
    <div class="c"><h3>Savatcha ${cart.items.length?'<a id="clr">Tozalash</a>':''}</h3><div id="cartL"></div></div>
    <div class="c" id="payC"></div>
    <div class="srch">${I('search')}<input id="pq" placeholder="Mahsulot qidirish" value="${esc(pq)}" autocomplete="off"></div>
    <div id="plist">${ps.map(p=>{const inCart=cart.items.find(i=>i.pack===p.pack),price=ptype==='dealer'?p.dealerUsd:p.retailUsd;
      return `<div class="row" data-add="${p.pack}">${box('box',p.stock>0?C.blue:C.gray,1)}<div style="flex:1;min-width:0"><b style="font-size:14px">${esc(p.name)}</b><br><small class="${p.stock>0?'mu':'bad'}">omborda ${num(p.stock)} dona</small></div>
        <div class="am"><b>${price>0?usd(price):'<span class="bad">narx yo‘q</span>'}</b><small>${inCart?'savatchada '+inCart.qty:'+ qo‘shish'}</small></div></div>`}).join('')||emptyBox('box','Mahsulot topilmadi')}</div>`;
  $('pq').oninput=e=>{pq=e.target.value;const pos=e.target.selectionStart;vSell(v);const i=$('pq');i.focus();i.setSelectionRange(pos,pos);};
  v.querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>{const p=+el.dataset.add,pr=product(p);
    if(!pr||pr.stock<=0)return toast('Omborda bu mahsulot yo‘q',false);
    const it=cart.items.find(i=>i.pack===p);if(it)it.qty=Math.min(it.qty+1,pr.stock);else cart.items.push({pack:p,qty:1,price:null});
    haptic('success');render();requote();});
  if($('pick'))$('pick').onclick=pickClient;if($('cc'))$('cc').onclick=pickClient;if($('newc'))$('newc').onclick=()=>newClient(true);
  if($('clr'))$('clr').onclick=()=>{cart.items=[];Q=null;render();};
  drawCart();drawTotals();
}
function drawCart(){
  const el=$('cartL');if(!el)return;
  if(!cart.items.length){el.innerHTML=emptyBox('cart','Mahsulotni pastdagi ro‘yxatdan tanlang');return;}
  el.innerHTML=cart.items.map((i,k)=>{const p=product(i.pack)||{name:'#'+i.pack,stock:0},ql=Q&&Q.lines[k];
    return `<div class="tl" style="flex-wrap:wrap"><span class="tx"><b>${esc(p.name)}</b><br><small>${ql?usd(ql.priceUsd)+' × '+num(i.qty)+' = '+usd(ql.priceUsd*i.qty)+(ql.priceSource==='special'?' · maxsus':''):'…'}</small></span>
      <span class="qty" style="flex:0 0 150px"><button data-m="${k}" aria-label="Kamaytirish">−</button><input class="inp" inputmode="numeric" data-q="${k}" value="${i.qty}" aria-label="Miqdor"><button data-p="${k}" aria-label="Ko‘paytirish">+</button></span>
      ${can('price')?`<span style="flex-basis:100%;display:flex;gap:8px;align-items:center;margin-top:6px"><small class="mu">Narx $</small><input class="inp" style="padding:8px" inputmode="decimal" data-pr="${k}" placeholder="${ql?ql.listPriceUsd:''}" value="${esc(i.price??'')}"></span>`:''}</div>`}).join('');
  const upd=(k,q)=>{const p=product(cart.items[k].pack);q=Math.max(0,Math.min(q,p?p.stock:q));if(!q)cart.items.splice(k,1);else cart.items[k].qty=q;render();requote();};
  el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>upd(+b.dataset.m,cart.items[+b.dataset.m].qty-1));
  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>upd(+b.dataset.p,cart.items[+b.dataset.p].qty+1));
  el.querySelectorAll('[data-q]').forEach(b=>b.onchange=()=>upd(+b.dataset.q,parseInt(b.value,10)||0));
  el.querySelectorAll('[data-pr]').forEach(b=>b.onchange=()=>{cart.items[+b.dataset.pr].price=b.value.trim()||null;requote();});
}
function drawTotals(){
  const el=$('payC');if(!el)return;
  if(!cart.items.length){el.style.display='none';return;}el.style.display='';
  const q=Q,tot=q?q.totalUsd:0,paidNow=cart.method==='cash_uzs'?(Number(cart.paidUzs)>0&&Number(cart.rate)>0?Math.round(Number(cart.paidUzs)/Number(cart.rate)*100)/100:0):Number(String(cart.paid).replace(',','.'))||0;
  const debt=Math.max(0,Math.round((tot-paidNow)*100)/100);
  el.innerHTML=`<h3>Chegirma va to‘lov</h3>
    ${can('discount')||admin()?'':'<div class="hint">Sizda chegirma berish ruxsati yo‘q.</div>'}
    <div class="seg" id="dm" ${can('discount')||admin()?'':'style="display:none"'}><button data-d="pct" class="${cart.dmode==='pct'?'on':''}">Chegirma %</button><button data-d="usd" class="${cart.dmode==='usd'?'on':''}">Chegirma $</button></div>
    <input class="inp" id="disc" inputmode="decimal" ${can('discount')||admin()?'':'hidden'} placeholder="${cart.dmode==='pct'?'0 – '+S.me.maxDiscountPct:'0.00'}" value="${esc(cart.discount)}">
    ${can('discount')&&!admin()?`<div class="hint">Sizning chegirma limitingiz: <b>${S.me.maxDiscountPct}%</b></div>`:''}
    <div style="margin-top:12px">
      <div class="tl"><span class="tx">Jami narx</span><b>${q?usd(q.subtotalUsd):'…'}</b></div>
      <div class="tl"><span class="tx">Jami chegirma${q&&q.discountPct?` <small>(${q.discountPct}%)</small>`:''}</span><b class="wa">${q?'−'+usd(q.discountUsd):'…'}</b></div>
      <div class="tl"><span class="tx"><b>To‘lanishi kerak</b></span><b style="font-size:18px">${q?usd(tot):'…'}</b></div></div>
    ${qErr?`<div class="ro" style="--pri:#f0384f;color:var(--bad)">${I('alert')} ${esc(qErr)}</div>`:''}
    ${q&&q.stockShort.length?`<div class="ro" style="color:var(--bad)">${I('alert')} ${esc(q.stockShort.join('; '))}</div>`:''}
    <label class="f">To‘lov turi</label>
    <div class="seg" id="pm">${Object.entries(PM).map(([k,v])=>`<button data-pm="${k}" class="${cart.method===k?'on':''}">${v[0]}</button>`).join('')}</div>
    ${cart.method==='cash_uzs'?`<div class="two"><div><label class="f">So‘m</label><input class="inp" id="puz" inputmode="numeric" value="${esc(cart.paidUzs)}" placeholder="0"></div>
      <div><label class="f">Kurs (1 $)</label><input class="inp" id="prt" inputmode="numeric" value="${esc(cart.rate)}" placeholder="${S.rate||''}"></div></div>`
      :`<label class="f">To‘landi, $</label><input class="inp" id="pd" inputmode="decimal" value="${esc(cart.paid)}" placeholder="0.00">`}
    <div class="acts"><button class="btn g" id="full">To‘liq to‘lov</button><button class="btn g" id="none">Hammasi qarzga</button></div>
    <div class="tl"><span class="tx">To‘landi</span><b class="ok">${usd(paidNow)}${cart.method==='cash_uzs'&&cart.paidUzs?' <small class="mu">'+som(cart.paidUzs)+'</small>':''}</b></div>
    <div class="tl"><span class="tx"><b>Qoldiq (qarzga)</b></span><b class="${debt>0?'bad':'ok'}" style="font-size:17px">${usd(debt)}</b></div>
    ${debt>0&&!cart.client?'<div class="hint bad">Chakana xaridorga qarzga berilmaydi — mijozni tanlang yoki to‘liq to‘lov oling.</div>':''}
    ${debt>0&&!S.me.allowCredit?'<div class="hint bad">Sizga qarzga berish ruxsati yo‘q.</div>':''}
    <label class="f">Izoh</label><input class="inp" id="nt" maxlength="300" value="${esc(cart.note)}" placeholder="ixtiyoriy">
    <div class="acts"><button class="btn ok" id="save" ${!q||qErr||q.stockShort.length?'disabled':''}>${I('check')}Sotuvni saqlash · ${q?usd(tot):''}</button></div>`;
  const keep=(id,fn)=>{const i=$(id);if(i)i.oninput=e=>{fn(e.target.value);const pos=e.target.selectionStart;drawTotals();const n=$(id);n.focus();try{n.setSelectionRange(pos,pos);}catch(x){}};};
  $('dm').onclick=e=>{const b=e.target.closest('button');if(!b)return;cart.dmode=b.dataset.d;cart.discount='';drawTotals();requote();};
  const di=$('disc');di.onchange=()=>{cart.discount=di.value.trim().replace(',','.');requote();};
  $('pm').onclick=e=>{const b=e.target.closest('button');if(!b)return;cart.method=b.dataset.pm;drawTotals();};
  keep('pd',x=>cart.paid=x);keep('puz',x=>cart.paidUzs=x.replace(/\D/g,''));keep('prt',x=>cart.rate=x.replace(/\D/g,''));
  $('nt').onchange=e=>cart.note=e.target.value;
  $('full').onclick=()=>{if(!q)return;if(cart.method==='cash_uzs'){const r=Number(cart.rate||S.rate);if(!r)return toast('Kursni kiriting',false);cart.rate=String(r);cart.paidUzs=String(Math.round(tot*r));}else cart.paid=String(tot);drawTotals();};
  $('none').onclick=()=>{cart.paid='';cart.paidUzs='';drawTotals();};
  $('save').onclick=saveSale;
}
function saveSale(){
  const q=Q;if(!q)return;
  const p={...cartPayload(),requestId:cart.rid,method:cart.method};
  if(cart.method==='cash_uzs'){if(cart.paidUzs){p.paidUzs=cart.paidUzs;p.rate=cart.rate||S.rate;}}else if(cart.paid)p.paid=String(cart.paid).replace(',','.');
  if(!p.paid&&!p.paidUzs)delete p.method;
  act('sell',p,'Sotuv saqlandi ✅',r=>{cart=newCart();cart.rate=S.rate?String(S.rate):'';Q=null;showReceipt(r.receipt);});
}
function showReceipt(r){
  openSheet(`<h2>${box('receipt',C.green)}Sotuv № ${r.id}</h2><div class="sub">${when(r.ts)} · ${esc(r.seller)}</div>

    ${r.lines.map(l=>`<div class="it"><span>${esc(l.name)}<br><small class="mu">${num(l.qty)} × ${usd(l.priceUsd)}${l.discountUsd?' · chegirma '+usd(l.discountUsd):''}</small></span><em>${usd(l.totalUsd)}</em></div>`).join('')}
    <div class="tl"><span class="tx">Jami narx</span><b>${usd(r.subtotalUsd)}</b></div>
    <div class="tl"><span class="tx">Jami chegirma</span><b class="wa">−${usd(r.discountUsd)}</b></div>
    <div class="tl"><span class="tx"><b>To‘lanishi kerak</b></span><b>${usd(r.totalUsd)}</b></div>
    <div class="tl"><span class="tx">To‘langan${r.method?' · '+PM[r.method][0]:''}</span><b class="ok">${usd(r.paidUsd)}${r.paidUzs?' <small class="mu">'+som(r.paidUzs)+'</small>':''}</b></div>
    <div class="tl"><span class="tx"><b>Qoldiq (qarz)</b></span><b class="${r.debtUsd>0?'bad':'ok'}">${usd(r.debtUsd)}</b></div>
    ${r.note?`<div class="note">${esc(r.note)}</div>`:''}
    <div class="acts"><button class="btn g" id="cl">Yopish</button></div>`,s=>s.querySelector('#cl').onclick=closeSheet);

  <div class="am"><b class="${c.debtUsd>0?'bad':'mu'}">${c.debtUsd>0?usd(c.debtUsd):'—'}</b><small>qarz</small></div></div>`;}

}

/* ---------- sheet & theme ---------- */
function showSheet(){$('sh').classList.add('on');$('ov').classList.add('on');try{tg&&tg.BackButton.show();}catch(e){}}
function openSheet(html,bind){const s=$('sh');s.innerHTML='<div class="grab"></div>'+html;showSheet();bind&&bind(s);}
function closeSheet(){$('sh').classList.remove('on');$('ov').classList.remove('on');try{tg&&tg.BackButton.hide();}catch(e){}}
$('ov').onclick=closeSheet;
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
function isDark(){const d=document.documentElement;return d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;}
function applyTheme(t){if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;}
function toggleTheme(){const t=isDark()?'light':'dark';applyTheme(t);try{localStorage.setItem('savdoTheme',t);}catch(e){}render();}
try{applyTheme(localStorage.getItem('savdoTheme')||(tg&&tg.colorScheme)||'');}catch(e){applyTheme(tg&&tg.colorScheme||'');}

/* ---------- start: login/parol (rahbar-web bilan bir xil sessiya tizimi, panel='savdo') ---------- */
const SPLASH='<img src="/app/premium-kit/aibi/aibi-mark.svg?v=3" alt="AIBI"><small>AIBI · SAVDO</small><div class="ldbar"><i></i></div>';
async function webApi(body){const r=await fetch('/api/web',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify({panel:'savdo',...body})});
  let j={};try{j=await r.json();}catch(e){}if(!r.ok)throw Error(j.error||'Kirib bo‘lmadi.');return j;}
function showLogin(msg){
  closeSheet();let sp=$('sp');if(!sp){sp=document.createElement('div');sp.id='sp';document.body.appendChild(sp);}
  sp.className='lg-on';sp.innerHTML=SPLASH+`<form class="lgf" id="lgf"><span class="aibi-wm" role="img" aria-label="AIBI"><img src="/app/premium-kit/aibi/aibi-mark.svg?v=3" alt="" style="height:26px">AIBI</span>
    <h2>Savdo paneli</h2><p>Login va parolni Telegram botdan oling: savdo akkauntidan <b>/webparol</b> yozing.</p>
    <label class="f" for="lgL">Login</label><input class="inp" id="lgL" autocomplete="username" required>
    <label class="f" for="lgP">Parol</label><input class="inp" id="lgP" type="password" autocomplete="current-password" required>
    <div class="er" id="lgE"></div><button class="btn" id="lgB">Kirish</button></form>`;
  $('lgE').textContent=msg||'';$('lgL').focus();
  $('lgf').onsubmit=async e=>{e.preventDefault();const b=$('lgB');b.disabled=true;$('lgE').textContent='';
    try{const j=await webApi({action:'login',login:$('lgL').value.trim().toLowerCase(),password:$('lgP').value});setToken(j.token);
      sp.className='';sp.innerHTML=SPLASH;start();}
    catch(x){$('lgE').textContent=x.message;b.disabled=false;}};
}
async function logout(){try{await webApi({action:'logout'});}catch(e){}setToken('');S=null;cart=newCart();$('app').innerHTML='';$('nav').querySelectorAll('button').forEach(b=>b.remove());showLogin('');}
function splashDone(){const sp=$('sp');if(!sp)return;sp.classList.add('x');setTimeout(()=>sp.remove(),500);}
function splashFail(msg,retry){const sp=$('sp');if(!sp)return;sp.className='er';
  sp.innerHTML=`<div class="ercard"><b>Savdo panelini ochib bo‘lmadi</b><p></p>${retry?'<button class="btn" id="rt">Qayta urinish</button>':''}</div>`;
  sp.querySelector('p').textContent=msg;if(retry)$('rt').onclick=()=>{sp.className='';sp.innerHTML=SPLASH;start();};}
function start(){load(true).then(splashDone).catch(e=>{if(TOKEN)splashFail(e.message,true);});}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&TOKEN&&!busy&&!$('sh').classList.contains('on'))load(true).catch(()=>{});});
if(TOKEN)start();else showLogin('');
</script>
